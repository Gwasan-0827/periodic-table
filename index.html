}

function memStart(){
  MEM.on = true; MEM.wrong = []; MEM.misses = 0; MEM.answered = false;
  if(MEM.mode === 'order'){ MEM.i = 0; orderNext(); }
  else if(MEM.mode === 'fill'){ fillStart(); }
  else { cardStart(); }
}

/* ═══ 1. 순서 외우기 ═══ */
function orderNext(){
  setFocus(true);
  const pool = memPool();
  if(MEM.i >= pool.length){ memResult(); return; }
  MEM.answered = false;
  const e = pool[MEM.i];

  // 오답은 가까운 번호에서 (헷갈릴 만한 것으로)
  const near = pool.filter(x => x.n !== e.n)
    .sort((a,b) => Math.abs(a.n - e.n) - Math.abs(b.n - e.n))
    .slice(0, 8);
  const opts = shuffle([e, ...shuffle(near).slice(0,3)]);

  quizEl.classList.add('on');
  qHeadEl.innerHTML = memHeadHTML(
    `<span class="qprog">${MEM.i + 1} / ${pool.length}</span>`);
  bindQClose();

  const doneList = pool.slice(0, MEM.i).map(x =>
    `<span class="oc" style="color:${cssv(CAT[x.c].v)}">${x.s}</span>`).join('');

  qBodyEl.innerHTML = `
    <div class="ochain">${doneList || `<span class="ophl">${t('memStartHint')}</span>`}</div>
    <div class="qlabel">${t('memQOrder').replace('{n}', MEM.i + 1)}</div>
    <div class="qopts">${opts.map(o =>
      `<button class="qopt" data-n="${o.n}">
         <b>${o.s}</b> <span class="oname">${elName(o)}</span>
       </button>`).join('')}</div>
    <div class="qfeed" id="qFeed"></div>`;

  qBodyEl.querySelectorAll('.qopt').forEach(b =>
    b.addEventListener('click', () => orderAnswer(+b.dataset.n, b, e)));
  const ch = qBodyEl.querySelector('.ochain');
  if(ch) ch.scrollLeft = ch.scrollWidth;
}

function orderAnswer(n, btn, e){
  if(MEM.answered) return;
  MEM.answered = true;
  const ok = n === e.n;
  if(ok){ SFX.ok(); noteHit(e.s); }
  else { SFX.fail(); MEM.wrong.push(e); noteMiss(e.s); }

  qBodyEl.querySelectorAll('.qopt').forEach(b => {
    b.disabled = true;
    if(+b.dataset.n === e.n) b.classList.add('right');
    else if(b === btn) b.classList.add('bad');
  });
  document.getElementById('qFeed').innerHTML =
    `<span class="${ok?'good':'bad'}">${ok ? t('qCorrect') : t('qWrong')}</span>
     ${ok ? '' : `<span class="ansis">${t('qAnswerWas')}: <b>${e.s} ${elName(e)}</b></span>`}
     <button class="btn" id="qNext">${t('qNext')}</button>`;
  document.getElementById('qNext').addEventListener('click', () => { MEM.i++; orderNext(); });
}

/* ═══ 2. 빈칸 채우기 ═══ */
function clearFill(){
  document.body.classList.remove('mem-fill');
  document.querySelectorAll('.cell.blank').forEach(c => c.classList.remove('blank'));
  document.querySelectorAll('.cell.qright,.cell.qbad').forEach(c => c.classList.remove('qright','qbad'));
}

function fillStart(){
  setFocus(false);            // 빈칸 채우기는 표를 봐야 함
  quizEl.classList.remove('on');
  VIEW = 'none';
  query = ''; catFilter.clear(); hlGroup = null; hlPeriod = null;
  const se = document.getElementById('search'); if(se) se.value = '';
  document.querySelectorAll('.lg').forEach(b => b.setAttribute('aria-pressed','false'));
  renderModeBar(); paint();

  document.body.classList.add('mem-fill');
  MEM.tray = memPool().map(e => e.n);
  MEM.picked = null; MEM.misses = 0; MEM.placed = 0;
  MEM.tray.forEach(n => document.querySelector(`.cell[data-n="${n}"]`).classList.add('blank'));
  renderFillBar();
}

function renderFillBar(){
  qBarEl.classList.add('on');
  const chips = MEM.tray
    .map(n => byNum[n])
    .sort((a,b) => a.s.localeCompare(b.s))
    .map(e => `<button class="fchip${MEM.picked===e.n?' on':''}" data-n="${e.n}"
        style="border-color:${cssv(CAT[e.c].v)}">${e.s}</button>`).join('');

  qBarEl.innerHTML = `
    <span class="qbq">${MEM.picked
      ? `<b>${byNum[MEM.picked].s}</b> — ${t('memPlaceHint')}`
      : t('memPickHint')}</span>
    <span class="qbmeta">${MEM.placed}/${MEM.placed + MEM.tray.length} · ${t('memMiss')} ${MEM.misses}</span>
    <button class="tbtn" id="qBarQuit">${t('qQuit')}</button>
    <div class="ftray">${chips}</div>`;

  qBarEl.querySelectorAll('.fchip').forEach(b => b.addEventListener('click', () => {
    MEM.picked = MEM.picked === +b.dataset.n ? null : +b.dataset.n;
    renderFillBar();
  }));
  document.getElementById('qBarQuit').addEventListener('click', memQuit);
}

function fillPlace(n, cell){
  // 아무것도 안 고른 채로 칸을 누르면 무시.
  // 여기서 정답을 자동 선택해주면 칸만 눌러도 풀려버림
  if(MEM.picked === null){
    const q = qBarEl.querySelector('.qbq');
    if(q){ q.classList.add('bad'); setTimeout(() => q.classList.remove('bad'), 400); }
    return;
  }
  if(MEM.picked === n){
    cell.classList.remove('blank');
    cell.classList.add('qright');
    setTimeout(() => cell.classList.remove('qright'), 500);
    MEM.tray = MEM.tray.filter(x => x !== n);
    noteHit(byNum[n].s);
    MEM.picked = null; MEM.placed++;
    SFX.pick();
    if(!MEM.tray.length){ qBarEl.classList.remove('on'); memResult(); return; }
    renderFillBar();
  } else {
    MEM.misses++;
    noteMiss(byNum[MEM.picked].s);
    MEM.picked = null;          // 틀리면 칩을 트레이로 되돌림
    SFX.fail();
    cell.classList.add('qbad');
    setTimeout(() => cell.classList.remove('qbad'), 450);
    renderFillBar();
  }
}

/* ═══ 3. 플래시카드 ═══ */
function cardStart(){
  MEM.queue = shuffle(memPool().map(e => e.n));
  MEM.done = 0; MEM.repeats = 0; MEM.flipped = false;
  quizEl.classList.add('on');
  renderCard();
}

function renderCard(){
  setFocus(true);
  if(!MEM.queue.length){ memResult(); return; }
  const e = byNum[MEM.queue[0]];
  const front = MEM.dir === 'sym2name' ? e.s : elName(e);
  const back  = MEM.dir === 'sym2name' ? elName(e) : e.s;
  const col = cssv(CAT[e.c].v);

  qHeadEl.innerHTML = memHeadHTML(
    `<span class="qprog">${t('memLeft')} ${MEM.queue.length}</span>
     <span class="qsc">${t('memKnown')} <b>${MEM.done}</b></span>`);
  bindQClose();

  qBodyEl.innerHTML = `
    <div class="fcard${MEM.flipped?' flip':''}" id="fCard" style="border-color:${col}">
      <div class="fc-front" style="color:${col}">${front}</div>
      ${MEM.flipped ? `
        <div class="fc-back">
          <div class="fc-name">${back}</div>
          <div class="fc-meta">${e.n}${LANG==='en'?'':'번'} · ${catName(e.c)}</div>
        </div>` : `<div class="fc-hint">${t('memFlip')}</div>`}
    </div>
    ${MEM.flipped ? `
      <div class="fcbtns">
        <button class="btn ghost" id="fAgain">${t('memAgain')}</button>
        <button class="btn" id="fKnow">${t('memGotIt')}</button>
      </div>` : ''}`;

  document.getElementById('fCard').addEventListener('click', () => {
    if(MEM.flipped) return;
    MEM.flipped = true; renderCard();
  });
  if(MEM.flipped){
    document.getElementById('fKnow').addEventListener('click', () => {
      const kn = MEM.queue.shift();
      noteHit(byNum[kn].s);
      MEM.done++; MEM.flipped = false; SFX.ok(); renderCard();
    });
    document.getElementById('fAgain').addEventListener('click', () => {
      const n = MEM.queue.shift();
      noteMiss(byNum[n].s);
      MEM.queue.splice(Math.min(3, MEM.queue.length), 0, n);   // 3장 뒤로 보냄
      MEM.repeats++; MEM.flipped = false; SFX.pick(); renderCard();
    });
  }
}

/* ═══ 결과 ═══ */
function memResult(){
  setFocus(true);
  MEM.on = false;
  clearFill();
  qBarEl.classList.remove('on');
  quizEl.classList.add('on');

  const total = memPool().length;
  let big, sub, best, isBest = false;

  if(MEM.mode === 'order'){
    const got = total - MEM.wrong.length;
    big = `${got}<span>/ ${total}</span>`;
    sub = `${Math.round(got / total * 100)}%`;
    best = memBest(); isBest = got > best;
    if(isBest) memSetBest(got);
    best = Math.max(best, got);
    sub += ` · ${t('qBest')} ${best}`;
  } else if(MEM.mode === 'fill'){
    big = `${MEM.misses}<span>${t('memMiss')}</span>`;
    sub = `${total}${LANG==='en'?' placed':'개 전부 배치'}`;
    const prev = memBest();
    isBest = prev === 0 || MEM.misses < prev - 1;
    if(isBest) memSetBest(MEM.misses + 1);
    sub += ` · ${t('memBestFill')} ${(isBest ? MEM.misses : prev - 1)}`;
  } else {
    big = `${total}<span>${LANG==='en'?'cards':'장'}</span>`;
    sub = `${t('memRepeat')} ${MEM.repeats}`;
    const prev = memBest();
    memSetBest(prev + 1);
    sub += ` · ${t('memClears')} ${prev + 1}`;
  }

  qHeadEl.innerHTML = memHeadHTML();
  bindQClose();
  qBodyEl.innerHTML = `
    <div class="qscore">${big}</div>
    <div class="qpct">${sub}${isBest ? ` <em>${t('qNewBest')}</em>` : ''}</div>
    ${MEM.wrong.length ? `
      <div class="qwtitle">${t('qReview')}</div>
      <div class="qwlist">${MEM.wrong.map(e => `
        <div class="qw">
          <span class="s" style="color:${cssv(CAT[e.c].v)}">${e.s}</span>
          <span class="n">${elName(e)}</span>
          <span class="a">${e.n}</span>
        </div>`).join('')}</div>` : ''}
    <div class="qbtns">
      <button class="btn" id="mAgain">${t('qRetry')}</button>
      <button class="btn ghost" id="mHome">${t('memBackHome')}</button>
    </div>`;
  document.getElementById('mAgain').addEventListener('click', memStart);
  document.getElementById('mHome').addEventListener('click', memHome);
  if(MEM.wrong.length === 0) SFX.gem(); else SFX.ok();
}

function memQuit(){
  setFocus(false);
  MEM.on = false;
  clearFill();
  qBarEl.classList.remove('on');
  quizEl.classList.add('on');
  memHome();
}

  atomEl = e; atomCol = col;

const setEl = document.getElementById('settings');
var setOpen = false;

/* 헤더에 숨겨둔 원래 버튼들을 그대로 쓴다 (기존 로직·저장 재사용) */
const hiddenBtn = id => document.getElementById(id);
const isOn = id => hiddenBtn(id).getAttribute('aria-pressed') === 'true';

function row(label, control, note){
  return `<div class="srow">
    <div class="slab">${label}${note ? `<span class="snote">${note}</span>` : ''}</div>
    <div class="sctl">${control}</div>
  </div>`;
}
const seg = (name, opts, cur) => `<div class="sseg" data-seg="${name}">${opts.map(([k,l]) =>
  `<button class="sopt${cur===k?' on':''}" data-k="${k}">${l}</button>`).join('')}</div>`;
const sw = (name, on) =>
  `<button class="sswitch${on?' on':''}" data-sw="${name}" aria-pressed="${on}"><i></i></button>`;

function renderSettings(){
  const L = LANG === 'en';
  let dexGot = 0, dexAll = 0;
  try{ const l = allEntries(); dexAll = l.length; dexGot = l.filter(x => found.has(x.name)).length; }catch(e){}

  let missTop = '';
  try{
    const m = loadStat();
    const top = Object.entries(m).filter(([,v]) => v[1] > 0)
      .sort((a,b) => b[1][1] - a[1][1]).slice(0, 6);
    if(top.length) missTop = top.map(([s,v]) => `${s}<sub>${v[1]}</sub>`).join(' · ');
  }catch(e){}

  document.getElementById('setTitle').textContent = t('setTitle');
  document.getElementById('setBody').innerHTML = `
    ${row(t('setLang'), seg('lang', [['ko','한국어'],['en','English']], LANG))}
    ${APP_MODE ? '' : row(t('setTone'), seg('safe', [['off',t('toneRaw')],['on',t('toneSafe')]], SAFE?'on':'off'), t('setToneNote'))}
    ${row(t('setSound'), sw('snd', sndOn))}
    ${row(t('setTox'), sw('tox', toxOn), t('setToxNote'))}
    ${row(t('setAtom'), sw('atom', SHOW_ATOM), t('setAtomNote'))}
    ${row(t('setBg'), sw('bg', typeof BG_ON !== 'undefined' && BG_ON), t('setBgNote'))}
    ${innerWidth > 700
      ? row(t('setW95'), sw('w95', typeof W95 !== 'undefined' && W95), t('setW95Note'))
      : ''}

    <div class="ssec">${t('setRecords')}</div>
    ${row(t('setDex'), `<button class="sbtn" data-clr="dex">${t('setReset')}</button>`, `${dexGot} / ${dexAll}`)}
    ${row(t('setLearnRec'), `<button class="sbtn" data-clr="learn">${t('setReset')}</button>`,
        missTop ? `${t('setOftenMissed')} ${missTop}` : t('setNoRec'))}
    ${row(t('setAll'), `<button class="sbtn danger" data-clr="all">${t('setReset')}</button>`)}

    ${typeof changelogHTML === 'function' ? changelogHTML() : ''}

    <div class="ssec">${t('setAbout')}</div>
    <div class="sabout">
      <p><b>${t('setTitle')} v${typeof APP_VER !== 'undefined' ? APP_VER : '1.0'}</b></p>
      <p>${L ? 'Element property data' : '원소 물성 데이터'} — PubChem / Penn State CS<br>
         <span class="dim">Copyright (c) 2015 Chris Andrejewski · ISC License</span></p>
      <p>${L ? 'Explosion sound' : '폭발 효과음'} — Dragon Studio<br>
         <span class="dim">Pixabay Content License</span></p>
      <p>${L ? 'Orbit typeface' : 'Orbit 서체'} — Sooun Cho, JAMO<br>
         <span class="dim">© 2022 The Orbit Project Authors · SIL Open Font License 1.1</span></p>
      <p class="dim">${t('setStorageNote')}</p>
    </div>`;

  // 세그먼트
  document.querySelectorAll('#setBody .sseg').forEach(g => {
    g.querySelectorAll('.sopt').forEach(b => b.addEventListener('click', () => {
      const kind = g.dataset.seg, k = b.dataset.k;
      if(kind === 'lang' && k !== LANG) hiddenBtn('langBtn').click();
      if(kind === 'safe' && (k === 'on') !== SAFE) hiddenBtn('safeBtn').click();
      renderSettings();
    }));
  });

  // 스위치
  document.querySelectorAll('#setBody .sswitch').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sw;
    if(k === 'snd') hiddenBtn('sndBtn').click();
    if(k === 'tox') hiddenBtn('toxBtn').click();
    if(k === 'bg'){
      BG_ON = !BG_ON;
      try{ localStorage.setItem('pt_bg', BG_ON ? '1' : '0'); }catch(e){}
      applyBg();
    }
    if(k === 'w95'){
      W95 = !W95;
      try{ localStorage.setItem('pt_w95', W95 ? '1' : '0'); }catch(e){}
      document.body.classList.toggle('w95', W95);
    }
    if(k === 'atom'){
      SHOW_ATOM = !SHOW_ATOM;
      try{ localStorage.setItem('pt_atom', SHOW_ATOM ? '1' : '0'); }catch(e){}
      document.body.classList.toggle('no-atom', !SHOW_ATOM);
      if(selected) select(selected);
    }
    renderSettings();

  if(typeof bindChangelog === 'function') bindChangelog();

  // 초기화
  document.querySelectorAll('#setBody .sbtn').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.confirm !== '1'){
      b.dataset.confirm = '1';
      b.textContent = t('setSure');
      b.classList.add('danger');
      setTimeout(() => {
        if(b.dataset.confirm === '1'){
          b.dataset.confirm = '0';
          b.textContent = t('setReset');
          if(b.dataset.clr !== 'all') b.classList.remove('danger');
        }
      }, 3000);
      return;
    }
    clearRecords(b.dataset.clr);
    renderSettings();
  }));
}

function clearRecords(kind){
  try{
    const keys = [];
    for(let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    for(const k of keys){
      if(!k || !k.startsWith('pt_')) continue;
      const isDex = k === 'pt_found' || k === 'pt_ach' || k === 'pt_fail';
      const isLearn = k.startsWith('pt_qbest') || k.startsWith('pt_mem')
                   || k === 'pt_miss' || k === 'pt_stat' || k === 'pt_ion';
      if(kind === 'all' || (kind === 'dex' && isDex) || (kind === 'learn' && isLearn)){
        if(kind === 'all' && (k === 'pt_lang' || k === 'pt_safe' || k === 'pt_atom')) continue;
        localStorage.removeItem(k);
      }
    }
    if(kind === 'dex' || kind === 'all') found = new Set();
  }catch(e){}
}

/* ═══════════════════════════════════════════════════
   원자 모형 그리기
   원래는 maxR = min(w,h)/2 로 잡았는데, 궤도가 세로로 0.42배
   납작한 타원이라 높이에 맞추면 가로가 통째로 남는다.
   특히 모바일(360×132)에서는 반지름이 50px 밖에 안 나왔음.
   가로·세로 여유를 각각 따져 더 크게 그린다.
   ═══════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════
   원자핵 배치
   황금각 나선은 해바라기 무늬가 눈에 보여 핵답지 않다.
   구 안에 무작위로 뿌린 뒤 겹침만 밀어내 뭉친 덩어리를 만든다.
   매 프레임 다시 뽑으면 지글거리므로 원소마다 고정된 배치를 쓴다.
   ═══════════════════════════════════════════════════ */
var nucleons = [];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildNucleus(e){
  const nP = e.n;
  const nN = Math.max(0, Math.round(e.m) - e.n);
  const total = nP + nN;
  const show = Math.min(total, 60);
  const showP = Math.max(1, Math.round(show * nP / total));

  const rnd = mulberry32(e.n * 2654435761 + 12345);
  const pts = [];
  for(let i = 0; i < show; i++){
    const r = Math.cbrt(rnd());               // 구 내부 균일 분포
    const th = Math.acos(2 * rnd() - 1);
    const ph = 2 * Math.PI * rnd();
    const st = Math.sin(th);
    pts.push({
      x: r * st * Math.cos(ph),
      y: r * st * Math.sin(ph),
      z: r * Math.cos(th),
      ph: rnd() * 6.283,
      p: false,
    });
  }

  // 번갈아 배정하면 줄무늬가 생기므로 무작위로 섞는다
  const idx = pts.map((_, i) => i);
  for(let i = idx.length - 1; i > 0; i--){
    const j = (rnd() * (i + 1)) | 0;
    const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  idx.slice(0, showP).forEach(i => pts[i].p = true);

  // 겹침 완화
  const MIN = show > 40 ? 0.26 : (show > 15 ? 0.36 : 0.52);
  for(let it = 0; it < 14; it++){
    for(let i = 0; i < pts.length; i++){
      for(let j = i + 1; j < pts.length; j++){
        const a = pts[i], b = pts[j];
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if(d2 < MIN*MIN && d2 > 1e-9){
          const d = Math.sqrt(d2), f = (MIN - d) / d * 0.5;
          dx *= f; dy *= f; dz *= f;
          a.x -= dx; a.y -= dy; a.z -= dz;
          b.x += dx; b.y += dy; b.z += dz;
        }
      }
    }
    for(const q of pts){                       // 구 밖으로 나간 것은 되돌린다
      const d = Math.sqrt(q.x*q.x + q.y*q.y + q.z*q.z);
      if(d > 1){ q.x /= d; q.y /= d; q.z /= d; }
    }
  }

  pts.sort((a, b) => a.z - b.z);               // 뒤쪽부터 그린다
  nucleons = pts;
}

const ORBIT_FLAT = 0.42;   // 궤도 타원의 세로/가로 비율

function orbitMaxR(w, h, minR){
  const pad = 18;
  const byWidth  = w / 2 - pad;
  const byHeight = (h / 2 - pad) / ORBIT_FLAT;
  return Math.max(minR + 10, Math.min(byWidth, byHeight));
}

function draw(now){
  requestAnimationFrame(draw);
  const w = cv.width / (devicePixelRatio > 2 ? 2 : devicePixelRatio);
  const h = cv.height / (devicePixelRatio > 2 ? 2 : devicePixelRatio);
  ctx.clearRect(0, 0, w, h);
  if(!atomEl) return;

  const t = (now - t0) / 1000;

  // 흔들림 (선택 시엔 0, 방사성 원소만 상시 떨림)
  shakeHit *= 0.90;
  if(shakeHit < 0.001) shakeHit = 0;
  const amp = shakeHit * 9 + instab * 1.6;
  const sx = amp ? (Math.sin(t*47.3)*0.6 + Math.sin(t*91.7)*0.4) * amp : 0;
  const sy = amp ? (Math.cos(t*53.9)*0.6 + Math.cos(t*83.1)*0.4) * amp : 0;
  ctx.save();
  ctx.translate(sx, sy);

  const cx = w/2, cy = h/2;
  const [R,G,B] = hex2rgb(atomCol);
  const rgba = a => `rgba(${R},${G},${B},${a})`;

  const shells = atomEl.sh;
  const minR = 30;
  const maxR = orbitMaxR(w, h, minR);

  shells.forEach((cnt, i) => {
    const rr = minR + (maxR - minR) * (shells.length === 1 ? 0.55 : i/(shells.length-1));
    ctx.beginPath();
    ctx.ellipse(cx, cy, rr, rr*ORBIT_FLAT, 0, 0, Math.PI*2);
    ctx.strokeStyle = rgba(0.16);
    ctx.lineWidth = 1;
    ctx.stroke();

    const speed = 0.55 / (i*0.45 + 1);
    const dir = i % 2 ? -1 : 1;
    const er = cnt > 20 ? 1.5 : (cnt > 10 ? 2 : 2.8);
    for(let k = 0; k < cnt; k++){
      const a = t*speed*dir + (k / cnt) * Math.PI*2;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr * ORBIT_FLAT;
      const front = Math.sin(a) > 0;
      ctx.beginPath();
      ctx.arc(x, y, er, 0, Math.PI*2);
      ctx.fillStyle = front ? rgba(0.95) : rgba(0.4);
      ctx.fill();
    }
  });

  // 핵
  const nP = atomEl.n;
  const nN = Math.max(0, Math.round(atomEl.m) - atomEl.n);
  const total = nP + nN;
  const coreR = Math.min(22, 5 + Math.sqrt(total) * 1.5);

  ctx.beginPath();
  ctx.arc(cx, cy, coreR*1.9, 0, Math.PI*2);
  const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR*1.9);
  gl.addColorStop(0, rgba(0.5));
  gl.addColorStop(1, rgba(0));
  ctx.fillStyle = gl; ctx.fill();

  if(!nucleons.length) buildNucleus(atomEl);
  const jit = 0.9 + instab * 2.6 + shakeHit * 3;
  for(const q of nucleons){
    const wx = Math.sin(t * (1.3 + instab*8) + q.ph) * jit;
    const wy = Math.cos(t * (1.1 + instab*8) + q.ph * 1.7) * jit;
    const x = cx + q.x * coreR + wx;
    const y = cy + q.y * coreR + wy;
    const depth = (q.z + 1) / 2;              // 0 뒤쪽 ~ 1 앞쪽
    const rad = 2.6 * (0.78 + depth * 0.34);
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI*2);
    ctx.globalAlpha = 0.55 + depth * 0.45;
    ctx.fillStyle = q.p ? rgba(0.95) : 'rgba(190,200,215,.8)';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  ctx.font = '600 13px Orbit, system-ui, sans-serif';
  ctx.fillStyle = rgba(0.85);
  ctx.textAlign = 'left';
  ctx.fillText(atomEl.s, 12, 24);

  if(instab > 0){
    ctx.font = '600 10px Orbit, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,140,140,.85)';
    ctx.textAlign = 'right';
    ctx.fillText('UNSTABLE', w - 12, 24);
  }
}

/* ── 담기 모드: 표에서 셀을 눌러 바로 담는다 ── */
// renderChips 가 초기화 중에 먼저 호출되므로 let 이면 TDZ 에 걸린다
var ADD_MODE = false;

function setAddMode(on){
  ADD_MODE = on;
  document.body.classList.toggle('mode-add', on);
  const b = document.getElementById('addModeBtn');
  b.setAttribute('aria-pressed', on);
  b.textContent = on ? t('addOn') : t('addOff');
  renderChips();
}

document.getElementById('addModeBtn').addEventListener('click', () => setAddMode(!ADD_MODE));

/* ── 담은 원소로 만들 수 있는 조합이 몇 개인지 (무엇인지는 안 알려줌) ── */
function reachableCount(){
  const have = new Set(mix.map(n => byNum[n].s));
  if(!have.size) return 0;
  const names = new Set();
  for(const k in RECIPES){
    const r = RECIPES[k];
    if(!r || !r[1]) continue;
    if(k.split('+').every(p => have.has(p))) names.add(r[1]);
  }
  for(const k in EXACT){
    const r = EXACT[k];
    if(!r || !r[1]) continue;
    const syms = [...k.matchAll(/([A-Z][a-z]?)(\d+)/g)].map(m => m[1]);
    if(syms.length && syms.every(p => have.has(p))) names.add(r[1]);
  }
  return names.size;
}

/* ── 결과 카드 부가 정보 ── */
function mixExtra(r, wasNew){
  const el = document.getElementById('mDex');
  if(!el) return;

  if(r && r[0]){
    let total = 0, got = 0;
    try{ const l = allEntries(); total = l.length; got = l.filter(x => found.has(x.name)).length; }catch(e){}
    // found.add 는 이 함수 다음에 실행되므로 새 발견이면 아직 반영 전
    const shown = got + (wasNew ? 1 : 0);
    el.innerHTML = wasNew
      ? `<span class="newbadge">${t('mixNew')}</span> <span class="dexprog">${t('dex')} ${shown} / ${total}</span>`
      : `<span class="dexprog">${t('mixKnown')} · ${t('dex')} ${shown} / ${total}</span>`;
    return;
  }

  if(typeof noteFail === 'function') noteFail();

  const n = reachableCount();
  el.innerHTML = n > 0
    ? `<span class="hintline">${t('mixHintSome').replace('{n}', n)}</span>`
    : `<span class="hintline">${t('mixHintNone')}</span>`;
}

/* ── 모달 버튼: 비우고 계속 ── */
document.getElementById('mWipe').addEventListener('click', () => {
  mix = [];
  renderChips();
  modal.classList.remove('on');
});

/* ── 트레이 안내문에 담기 모드 상태를 반영 ── */
function renderChips(){
  if(!mix.length){
    chipsEl.innerHTML = `<span class="ph">${ADD_MODE ? t('trayPhAdd') : t('trayPh')}</span>`;
    mixBtn.disabled = true;
    return;
  }
  const order = [], cnt = {};
  mix.forEach(n => { if(cnt[n] === undefined){ order.push(n); cnt[n] = 0; } cnt[n]++; });

  chipsEl.innerHTML = order.map(n => {
    const e = byNum[n];
    return `<span class="chip" data-n="${n}" style="color:${cssv(CAT[e.c].v)}">
      <span class="mi" data-act="minus">−</span>
      ${e.s}<span class="n">×${cnt[n]}</span>
      <span class="pl" data-act="plus">＋</span>
    </span>`;
  }).join('') + `<span class="cnt">${t('total')} ${mix.length} / ${MIX_MAX}</span>`;

  chipsEl.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', ev => {
      const n = +c.dataset.n;
      if(ev.target.dataset.act === 'plus'){ addToMix(n); return; }
      const i = mix.lastIndexOf(n);
      if(i >= 0) mix.splice(i, 1);
      renderChips();
    });
  });
  mixBtn.disabled = mix.length < 2;
}

/* 한 번에 여러 개 담기.
   한도를 넘으면 들어갈 만큼만 담고 알려준다 (원래는 조용히 무시됐음) */
var ADD_QTY = 1;

function flashFull(){
  const c = chipsEl.querySelector('.cnt');
  if(c){ c.classList.add('full'); setTimeout(() => c.classList.remove('full'), 500); }
  const q = document.getElementById('qtyNote');
  if(q){ q.classList.add('warn'); setTimeout(() => q.classList.remove('warn'), 900); }
}

function addToMix(n, count){
  const want = Math.max(1, count || 1);
  const room = MIX_MAX - mix.length;
  if(room <= 0){ flashFull(); SFX.fail(); return; }
  const put = Math.min(want, room);
  for(let i = 0; i < put; i++) mix.push(n);
  if(put < want) flashFull();
  SFX.pick();
  renderChips();
}

/* 개수 입력 */
const qtyEl = document.getElementById('qtyN');
function setQty(v){
  ADD_QTY = Math.max(1, Math.min(MIX_MAX, Math.round(v) || 1));
  qtyEl.value = ADD_QTY;
  const ab = document.getElementById('addBtn');
  if(ab) ab.textContent = ADD_QTY > 1 ? `${t('addMixN')} ×${ADD_QTY}` : t('addMix');
}
qtyEl.addEventListener('input', () => {
  const v = parseInt(qtyEl.value, 10);
  if(!isNaN(v)) setQty(v);
});
qtyEl.addEventListener('blur', () => setQty(parseInt(qtyEl.value, 10)));
document.getElementById('qtyUp').addEventListener('click', () => setQty(ADD_QTY + 1));
document.getElementById('qtyDn').addEventListener('click', () => setQty(ADD_QTY - 1));

setAddMode(false);

/* ═══════════════════════════════════════════════════
   융합 애니메이션
   · 전체 길이를 1.6초 → 1.28초로 줄임 (반복 조합이 답답했음)
   · 실패는 합쳐지지 못하고 튕기도록 따로 연출
   · 터진 뒤 결과 화학식이 떠오름
   ═══════════════════════════════════════════════════ */
const FUSE_IN = 720, FUSE_OUT = 560;
let fuseLabel = '';

function playFusion(nums, ok, cb, boom, gem){
  fitFuse();
  const R = Math.min(innerWidth, innerHeight) * 0.32;
  fuseItems = nums.map((n, i) => {
    const e = byNum[n];
    return {
      sym: e.s,
      col: cssv(CAT[e.c].v),
      a0: (i / nums.length) * Math.PI * 2 - Math.PI/2,
      r0: R * (0.85 + Math.random() * 0.3),
      spin: 3 + Math.random() * 2,
      jit: Math.random() * 6.28,
    };
  });
  sparks = [];
  fuseOk = ok; fuseCb = cb; fuseOn = true; fuseBoom = !!boom; fuseGem = !!gem;
  fuseStart = performance.now();
  // 결과 카드는 이 시점에 이미 채워져 있다
  const f = document.getElementById('mFormula');
  fuseLabel = f ? (f.textContent || '') : '';
  fuseEl.classList.add('on');
  requestAnimationFrame(fuseLoop);
}

function fuseLoop(now){
  if(!fuseOn) return;
  const el = now - fuseStart;
  const w = innerWidth, h = innerHeight;
  const cx = w/2, cy = h/2;
  fctx.clearRect(0, 0, w, h);

  if(el < FUSE_IN){
    const t = el / FUSE_IN;
    const k = easeInCubic(t);

    // 실패하면 끝까지 모이지 못하고 밀려난다
    const REPEL = 0.74;
    const kk = (!fuseOk && t > REPEL)
      ? easeInCubic(REPEL) - (t - REPEL) * 0.5
      : k;

    const coreR = 4 + Math.max(0, kk) * 26;
    const g = fctx.createRadialGradient(cx, cy, 0, cx, cy, coreR*3.2);
    const heat = fuseOk ? (0.18 + k*0.75) : (0.10 + Math.max(0,kk)*0.28);
    g.addColorStop(0, `rgba(255,255,255,${heat})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(cx, cy, coreR*3.2, 0, Math.PI*2); fctx.fill();

    // 충돌 직전 충전 링
    if(fuseOk && t > 0.86){
      const ct = (t - 0.86) / 0.14;
      fctx.beginPath();
      fctx.arc(cx, cy, 90 * (1 - ct) + 20, 0, Math.PI*2);
      fctx.strokeStyle = `rgba(255,255,255,${ct * 0.55})`;
      fctx.lineWidth = 2 + ct * 3;
      fctx.stroke();
    }

    fuseItems.forEach(it => {
      const wob = (!fuseOk && t > REPEL) ? Math.sin(el/26 + it.jit) * 5 : 0;
      const r = it.r0 * (1 - kk) + wob;
      const a = it.a0 + kk * it.spin;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;

      for(let q = 1; q <= 6; q++){
        const k2 = Math.max(0, kk - q*0.022);
        const rr = it.r0 * (1 - k2);
        const aa = it.a0 + k2 * it.spin;
        fctx.beginPath();
        fctx.arc(cx + Math.cos(aa)*rr, cy + Math.sin(aa)*rr, 15 - q*1.8, 0, Math.PI*2);
        fctx.fillStyle = it.col;
        fctx.globalAlpha = 0.10 * (1 - q/7);
        fctx.fill();
      }
      fctx.globalAlpha = 1;

      const rad = 20 * (1 - Math.max(0,kk)*0.45);
      const gg = fctx.createRadialGradient(x, y, 0, x, y, rad*2);
      gg.addColorStop(0, it.col);
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      fctx.fillStyle = gg; fctx.globalAlpha = 0.55;
      fctx.beginPath(); fctx.arc(x, y, rad*2, 0, Math.PI*2); fctx.fill();
      fctx.globalAlpha = 1;

      fctx.beginPath(); fctx.arc(x, y, rad, 0, Math.PI*2);
      fctx.fillStyle = '#0b0d11'; fctx.fill();
      fctx.lineWidth = 2; fctx.strokeStyle = it.col; fctx.stroke();

      fctx.font = `700 ${Math.round(rad*0.95)}px Orbit, system-ui, sans-serif`;
      fctx.fillStyle = it.col;
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      fctx.fillText(it.sym, x, y);
    });

    requestAnimationFrame(fuseLoop);
    return;
  }

  const t2 = (el - FUSE_IN) / FUSE_OUT;

  if(sparks.length === 0){
    const N = fuseBoom ? 160 : (fuseGem ? 90 : (fuseOk ? 46 : 22));
    const BOOMC = ['#ffd43b','#ff922b','#ff6b6b','#fff3bf'];
    for(let i = 0; i < N; i++){
      const a = fuseOk
        ? Math.random() * Math.PI * 2
        : Math.PI * (0.15 + Math.random() * 0.7);   // 실패는 아래로 흩어짐
      const sp = (fuseBoom ? 15 : (fuseOk ? 6 : 2.6)) * (0.4 + Math.random());
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        col: fuseGem ? `hsl(${(i*29)%360} 90% 65%)`
           : (fuseBoom ? BOOMC[i % BOOMC.length]
           : (fuseOk ? fuseItems[i % fuseItems.length].col : '#6b7280')),
        r: (fuseBoom ? 2.5 : 2) + Math.random()*3,
      });
    }
  }

  if(fuseOk){
    const rings = fuseBoom ? 3 : (fuseGem ? 4 : 1);
    for(let q = 0; q < rings; q++){
      const tt = Math.max(0, Math.min(1, t2 - q*0.12));
      const rr = easeOutCubic(tt) * Math.min(w,h) * (fuseBoom ? 0.75 : 0.42);
      fctx.beginPath(); fctx.arc(cx, cy, rr, 0, Math.PI*2);
      fctx.strokeStyle = fuseBoom
        ? `rgba(255,180,80,${Math.max(0, 0.8 - tt)})`
        : (fuseGem
          ? `hsla(${(tt*360)|0} 95% 70% / ${Math.max(0, 0.85 - tt)})`
          : `rgba(255,255,255,${Math.max(0, 0.75 - tt)})`);
      fctx.lineWidth = (fuseBoom ? 5 : 3) * (1 - tt);
      fctx.stroke();
    }
  }

  const fl = Math.max(0, (fuseOk ? 1 : 0.45) - t2*2.4);
  if(fl > 0){
    const g = fctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w,h)*(fuseBoom?0.8:0.45));
    g.addColorStop(0, `rgba(255,255,255,${fl})`);
    if(fuseBoom) g.addColorStop(0.35, `rgba(255,180,70,${fl*0.7})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = g;
    fctx.fillRect(0, 0, w, h);
  }

  sparks.forEach(s2 => {
    s2.x += s2.vx; s2.y += s2.vy;
    s2.vy += fuseOk ? 0.05 : 0.22;
    s2.vx *= 0.985; s2.vy *= 0.985;
    fctx.globalAlpha = Math.max(0, 1 - t2);
    fctx.beginPath(); fctx.arc(s2.x, s2.y, s2.r, 0, Math.PI*2);
    fctx.fillStyle = s2.col; fctx.fill();
  });
  fctx.globalAlpha = 1;

  // 결과 화학식이 떠오름
  if(fuseLabel){
    const rise  = Math.min(1, t2 / 0.30);
    const fade  = Math.max(0, 1 - Math.max(0, t2 - 0.55) / 0.45);
    const alpha = easeOutCubic(rise) * fade;
    if(alpha > 0.01){
      const size = Math.max(26, Math.min(54, Math.round(Math.min(w,h) * 0.095)));
      fctx.save();
      fctx.globalAlpha = alpha;
      fctx.translate(cx, cy);
      fctx.scale(0.72 + easeOutCubic(rise) * 0.28, 0.72 + easeOutCubic(rise) * 0.28);
      fctx.font = `800 ${size}px Orbit, system-ui, sans-serif`;
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      fctx.fillStyle = fuseOk ? '#ffffff' : 'rgba(255,150,150,.95)';
      fctx.fillText(fuseLabel, 0, 0);
      fctx.restore();
    }
  }

  if(t2 >= 1){
    fuseOn = false;
    fuseEl.classList.remove('on');
    fctx.clearRect(0, 0, w, h);
    if(fuseCb) fuseCb();
    return;
  }
  requestAnimationFrame(fuseLoop);
}

/* ═══════════════════════════════════════════════════
   배경 파형
   캔버스 rAF 루프 대신 SVG 경로를 CSS transform 으로 흘린다.
   배경은 항상 켜져 있으므로 GPU 합성이 훨씬 가볍다.
   ═══════════════════════════════════════════════════ */
const WAVE_W = 2000, WAVE_H = 400;

/* 정수 주기의 사인들을 합쳐 만든 파형.
   x 와 x+WAVE_W 의 값이 같아 좌우로 흘려도 이음매가 없다. */
function wavePath(baseY, layers){
  const pts = [];
  for(let x = 0; x <= WAVE_W * 2; x += 10){
    const p = x / WAVE_W;
    let y = baseY;
    for(const [cycles, amp, phase] of layers){
      y += Math.sin(p * Math.PI * 2 * cycles + phase) * amp;
    }
    pts.push(x + ',' + y.toFixed(1));
  }
  return 'M' + pts.join(' L');
}

(function makeWaves(){
  const defs = [
    // baseY, 사인 성분들, 두께, 투명도, 초, 방향
    [188, [[1, 52, 0.0], [2, 17, 1.1]],   1.6, 0.20, 34, 1],
    [232, [[1, 38, 2.2], [3, 12, 0.4]],   1.3, 0.15, 47, -1],
    [274, [[2, 30, 1.0], [1, 20, 3.4]],   1.1, 0.11, 61, 1],
    [312, [[1, 24, 4.1], [4,  8, 2.0]],   1.0, 0.08, 78, -1],
  ];

  const wrap = document.createElement('div');
  wrap.id = 'waves';
  wrap.innerHTML = defs.map(([y, layers, sw, op, dur, dir], i) => `
    <svg viewBox="0 0 ${WAVE_W * 2} ${WAVE_H}" preserveAspectRatio="none"
         style="--sw:${sw};--op:${op};--dur:${dur}s;--dir:${dir}">
      <path d="${wavePath(y, layers)}" vector-effect="non-scaling-stroke"/>
    </svg>`).join('');

  const g = document.getElementById('glow');
  if(g) g.parentNode.insertBefore(wrap, g.nextSibling);
  else document.body.insertBefore(wrap, document.body.firstChild);
})();

/* 기호 → 그 원소가 쓰이는 조합 목록. 한 번만 만든다. */
var USES = null;   // 앞쪽 코드에서 참조될 수 있어 var
function buildUses(){
  if(USES) return USES;
  USES = {};
  const add = (sym, item) => { (USES[sym] || (USES[sym] = [])).push(item); };

  for(const it of allEntries()){
    // 키에서 원소 기호만 뽑는다. "Na+Cl" 과 "Cl1+Na1" 둘 다 처리됨
    const syms = new Set(it.key.match(/[A-Z][a-z]?/g) || []);
    for(const s of syms) add(s, it);
  }
  // 같은 원소만 모았을 때 나오는 것들
  for(const sym in SINGLE){
    for(const t of SINGLE[sym]){
      if(!t[3]) continue;
      add(sym, { name:t[3], formula:t[2], sub:t[4], key:`${sym}×${t[0]}~${t[1]}`, single:true });
    }
  }
  return USES;
}

var USES_SHOWN = 8;

function lineageHTML(e){
  const list = buildUses()[e.s];
  if(!list || !list.length) return '';

  const got = list.filter(x => found.has(x.name));
  const left = list.length - got.length;

  // 발견한 것부터, 그다음 잠긴 것 순
  const rows = [];
  for(const x of got.slice(0, USES_SHOWN)){
    const r = locRec([x.formula, x.name, x.sub]);
    rows.push(`<div class="lu">
      <span class="luf">${fmtFormula(r[0])}</span>
      <span class="lun">${r[1]}</span>
    </div>`);
  }
  const room = USES_SHOWN - rows.length;
  if(room > 0){
    for(const x of list.filter(x => !found.has(x.name)).slice(0, room)){
      const hint = x.single ? x.key : x.key.replace(/(\d+)/g, '×$1').split('+').join(' + ');
      const loose = (!x.single && !x.exact) ? ` <em>${t('anyRatio')}</em>` : '';
      rows.push(`<div class="lu locked">
        <span class="luf">???</span>
        <span class="lun">${hint}${loose}</span>
      </div>`);
    }
  }
  const more = list.length - rows.length;

  return `
    <div class="shellTitle">${t('useTitle')}
      <span class="usecnt">${got.length} / ${list.length}</span>
    </div>
    <div class="uses">${rows.join('')}</div>
    ${more > 0 ? `<div class="usemore">${t('useMore').replace('{n}', more)}</div>` : ''}`;
}

/* ═══════════════════════════════════════════════════

   ═══════════════════════════════════════════════════ */
var GRIDPOS = null;   // 원자번호 → {r, c}
var GRIDMAP = null;   // "r,c" → 원자번호

function buildGridMap(){
  const COLS = 19;                     // 주기 라벨 1칸 + 18족
  GRIDPOS = {}; GRIDMAP = {};
  let slot = 0;
  for(const el of grid.children){
    if(el.classList.contains('rowgap')){
      slot += (COLS - (slot % COLS)) % COLS;   // 남은 칸 채우고
      slot += COLS;                            // rowgap 이 한 줄 차지
      continue;
    }
    if(el.classList.contains('cell')){
      const n = +el.dataset.n;
      const r = Math.floor(slot / COLS), c = slot % COLS;
      GRIDPOS[n] = { r, c };
      GRIDMAP[r + ',' + c] = n;
    }
    slot++;
  }
}

function moveSel(dr, dc){
  if(!GRIDPOS) buildGridMap();
  const cur = GRIDPOS[selected];
  if(!cur) return;
  let { r, c } = cur;
  for(let i = 0; i < 30; i++){
    r += dr; c += dc;
    if(r < 0 || c < 0 || r > 20 || c > 19) return;
    const n = GRIDMAP[r + ',' + c];
    if(n){
      select(n);
      const cell = document.querySelector(`.cell[data-n="${n}"]`);
      if(cell && cell.scrollIntoView) cell.scrollIntoView({ block:'nearest', inline:'nearest' });
      return;
    }
  }
}

function overlayOpen(){
  return quizEl.classList.contains('on')
      || setEl.classList.contains('on')
      || dexEl.classList.contains('on')
      || modal.classList.contains('on')
      || fuseEl.classList.contains('on');
}

addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || ev.target.isContentEditable){
    if(ev.key === 'Escape') ev.target.blur();
    return;
  }
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;

  if(ev.key === 'Escape'){
    if(modal.classList.contains('on')) modal.classList.remove('on');
    else if(dexEl.classList.contains('on')) dexEl.classList.remove('on');
    else if(setEl.classList.contains('on')) closeSettings();
    else if(quizEl.classList.contains('on')) qEnd();
    return;
  }
  if(overlayOpen()) return;

  const D = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[ev.key];
  if(D){ ev.preventDefault(); moveSel(D[0], D[1]); return; }

  if(ev.key === 'Enter' || ev.key === ' '){
    if(selected){ ev.preventDefault(); addToMix(selected, ADD_QTY); }
    return;
  }
  if(ev.key === '/'){
    ev.preventDefault();
    const se = document.getElementById('search');
    if(se) se.focus();
  }
});

const fsub = s => s.replace(/(\d+)/g, '<sub>$1</sub>');
const qLabel = q => {
  const n = Math.abs(q);
  return (n > 1 ? n : '') + (q > 0 ? '+' : '−');
};
const ionHTML = i => `${fsub(i.sym)}<sup>${qLabel(i.q)}</sup>`;

function gcd(x, y){ return y ? gcd(y, x % y) : x; }

/* 전하가 0이 되는 가장 작은 정수비 */
function ionAnswer(c, a){
  const g = gcd(c.q, Math.abs(a.q));
  return { a: Math.abs(a.q) / g, b: c.q / g };
}

function ionFormula(c, a, x, y){
  const cp = fsub(c.sym) + (x > 1 ? `<sub>${x}</sub>` : '');
  const ap = a.poly
    ? (y > 1 ? `(${fsub(a.sym)})<sub>${y}</sub>` : fsub(a.sym))
    : fsub(a.sym) + (y > 1 ? `<sub>${y}</sub>` : '');
  return cp + ap;
}
function ionName(c, a){
  return LANG === 'en' ? `${c.en} ${a.en}` : `${a.ko}${c.ko}`;
}

function ionFound(){
  try{ return new Set(JSON.parse(localStorage.getItem('pt_ion') || '[]')); }
  catch(e){ return new Set(); }
}
function ionSave(set){
  try{ localStorage.setItem('pt_ion', JSON.stringify([...set])); }catch(e){}
}

function renderIon(){
  setFocus(false);
  const c = CATIONS[ION.ci], a = ANIONS[ION.ai];
  const sum = c.q * ION.a + a.q * ION.b;
  const ans = ionAnswer(c, a);
  const reduced = gcd(ION.a, ION.b) === 1;
  const ok = sum === 0 && reduced;
  const got = ionFound();
  const name = ionName(c, a);

  if(ok && !got.has(`${c.sym}-${a.sym}`)){
    got.add(`${c.sym}-${a.sym}`);
    ionSave(got);
    SFX.ok();
  }

  qHeadEl.querySelector('.hubtabs') || hubHead();

  qBodyEl.innerHTML = `
    <div class="ionpick">
      <div class="qsl">${t('ionCation')}</div>
      <div class="qrow">${CATIONS.map((x,i) =>
        `<button class="qpick ion-c${i===ION.ci?' on':''}" data-i="${i}">${ionHTML(x)}</button>`).join('')}</div>
      <div class="qsl">${t('ionAnion')}</div>
      <div class="qrow">${ANIONS.map((x,i) =>
        `<button class="qpick ion-a${i===ION.ai?' on':''}" data-i="${i}">${ionHTML(x)}</button>`).join('')}</div>
    </div>

    <div class="ionbuild${ok ? ' ok' : ''}">
      <div class="ionrow">
        <span class="ionstep"><button data-s="a-">−</button><b>${ION.a}</b><button data-s="a+">＋</button></span>
        <span class="ionchip">${ionHTML(c)}</span>
        <span class="ionplus">+</span>
        <span class="ionstep"><button data-s="b-">−</button><b>${ION.b}</b><button data-s="b+">＋</button></span>
        <span class="ionchip">${ionHTML(a)}</span>
      </div>
      <div class="ionsum ${sum === 0 ? (reduced ? 'zero' : 'warn') : ''}">
        ${t('ionTotal')}
        <b>${sum > 0 ? '+' + sum : (sum < 0 ? '−' + Math.abs(sum) : '0')}</b>
        ${sum !== 0 ? `<em>${t('ionNotYet')}</em>`
          : (reduced ? '' : `<em>${t('ionReduce')}</em>`)}
      </div>
      ${ok ? `
        <div class="ionres">
          <div class="ionformula">${ionFormula(c, a, ION.a, ION.b)}</div>
          <div class="ionname">${name}</div>
          <div class="ionwhy">${t('ionWhy')
            .replace('{a}', `${ION.a}×${qLabel(c.q)}`)
            .replace('{b}', `${ION.b}×${qLabel(a.q)}`)}</div>
        </div>` : `
        <div class="ionhint">${t('ionHint')}</div>`}
    </div>

    <div class="ionprog">${t('ionMade')} ${got.size} / ${CATIONS.length * ANIONS.length}</div>`;

  qBodyEl.querySelectorAll('.ion-c').forEach(b => b.addEventListener('click', () => {
    ION.ci = +b.dataset.i; ION.a = 1; ION.b = 1; SFX.pick(); renderIon();
  }));
  qBodyEl.querySelectorAll('.ion-a').forEach(b => b.addEventListener('click', () => {
    ION.ai = +b.dataset.i; ION.a = 1; ION.b = 1; SFX.pick(); renderIon();
  }));
  qBodyEl.querySelectorAll('.ionstep button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s;
    const k = s[0] === 'a' ? 'a' : 'b';
    ION[k] = Math.max(1, Math.min(9, ION[k] + (s[1] === '+' ? 1 : -1)));
    renderIon();
  }));
}

const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown',

  }catch(e){}
}

addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || ev.target.isContentEditable) return;

  konBuf.push(ev.key.length === 1 ? ev.key.toLowerCase() : ev.key);
  if(konBuf.length > KONAMI.length) konBuf.shift();
  if(konBuf.length === KONAMI.length && konBuf.every((k, i) => k === KONAMI[i])){
    konBuf = [];
    eggReveal();
  }
});

addEventListener('click', ev => {
  const el = document.getElementById('egg');
  if(el && el.classList.contains('on') && ev.target === el) eggClose();
});

/* ═══════════════════════════════════════════════════
   폭발음
   기존에는 900Hz 고정 필터 노이즈 + 사인파 두 개가 전부라
   주파수가 전혀 움직이지 않아 "퍽" 하고 끝났다.
   실제 폭발은 시간에 따라 소리가 변한다:
     파열 → 굉음 → 우르릉 → 파편
   다섯 겹을 시간차로 겹치고 필터를 쓸어내려 그 변화를 만든다.
   ═══════════════════════════════════════════════════ */

/* 여러 겹이 동시에 울리면 쉽게 찌그러지므로 압축기를 하나 둔다 */
let MASTER = null;
function bus(a){
  if(MASTER && MASTER.ctx === a) return MASTER.node;
  const comp = a.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 22;
  comp.ratio.value = 9;
  comp.attack.value = 0.003;
  comp.release.value = 0.28;
  comp.connect(a.destination);
  MASTER = { ctx: a, node: comp };
  return comp;
}

function noiseSrc(a, dur){
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource();
  s.buffer = buf;
  return s;
}

function boomSound(scale){
  if(!sndOn) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime;
  const S = Math.max(0.6, Math.min(2, scale || 1));
  const out = bus(a);

  // 1. 파열 — 첫 순간의 날카로운 균열
  {
    const s = noiseSrc(a, 0.07);
    const hp = a.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(2600, t);
    hp.frequency.exponentialRampToValueAtTime(900, t + 0.07);
    const g = a.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    s.connect(hp); hp.connect(g); g.connect(out);
    s.start(t); s.stop(t + 0.08);
  }

  // 2. 타격 — 가슴을 치는 저음. 높은 데서 뚝 떨어진다
  {
    const o = a.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150 * S, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.24);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.34);
  }

  // 3. 본체 — 필터를 쓸어내려 굉음이 우르릉으로 바뀌게
  {
    const dur = 1.25 * S;
    const s = noiseSrc(a, dur);
    const lp = a.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3400, t);
    lp.frequency.exponentialRampToValueAtTime(105, t + dur);
    lp.Q.value = 1.3;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.44, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(lp); lp.connect(g); g.connect(out);
    s.start(t); s.stop(t + dur + 0.05);
  }

  // 4. 잔향 — 오래 남는 초저역
  {
    const dur = 1.7 * S;
    const o = a.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(64, t);
    o.frequency.exponentialRampToValueAtTime(21, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }

  // 5. 파편 — 흩어져 떨어지는 조각들
  const debris = Math.round(8 * S);
  for(let i = 0; i < debris; i++){
    const dt = 0.10 + Math.random() * 0.75 * S;
    const s = noiseSrc(a, 0.06);
    const bp = a.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800 + Math.random() * 2800;
    bp.Q.value = 2.2;
    const g = a.createGain();
    g.gain.setValueAtTime(0.05 + Math.random() * 0.05, t + dt);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.07);
    s.connect(bp); bp.connect(g); g.connect(out);
    s.start(t + dt); s.stop(t + dt + 0.08);
  }
}

/* 폭발의 크기는 무엇을 터뜨렸는지로 정한다 */
function boomScale(name){
  if(!name) return 1;
  if(name.includes('존나') || name.includes('아주 큰')) return 1.7;
  if(name.includes('루비듐')) return 1.45;
  if(name.includes('더 큰')) return 1.3;
  if(name.includes('임계질량')) return 2;
  return 1;
}

var boomBuf = null, boomTried = false;

function loadBoom(){
  if(boomBuf || boomTried) return;
  const a = ac(); if(!a) return;
  boomTried = true;
  try{
    const bin = atob(BOOM_B64);
    const arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    a.decodeAudioData(arr.buffer,
      b => { boomBuf = b; },
      () => { boomBuf = null; });       // 실패하면 코드로 만든 소리로 돌아간다
  }catch(e){ boomBuf = null; }
}

/* 첫 상호작용 때 미리 디코딩해 둔다 */
addEventListener('pointerdown', loadBoom, { once: true });
addEventListener('keydown', loadBoom, { once: true });

function boomSample(scale){
  const a = ac();
  if(!a || !boomBuf) return false;
  const S = Math.max(0.6, Math.min(2, scale || 1));
  const t = a.currentTime;
  const out = bus(a);

  const src = a.createBufferSource();
  src.buffer = boomBuf;
  // 클수록 느리고 낮게 재생해 더 무겁게 들리도록
  src.playbackRate.value = Math.pow(S, -0.35);

  const g = a.createGain();
  g.gain.setValueAtTime(0.55 + (S - 1) * 0.12, t);
  src.connect(g); g.connect(out);
  src.start(t);

  // 큰 폭발에는 초저역을 한 겹 더 얹는다
  if(S >= 1.35){
    const dur = 1.5 * S;
    const o = a.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(58, t);
    o.frequency.exponentialRampToValueAtTime(20, t + dur);
    const g2 = a.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(0.22, t + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g2); g2.connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return true;
}

/* 샘플이 준비됐으면 샘플로, 아니면 코드로 만든 소리로 */
SFX.boom = function(scale){
  if(!sndOn) return;
  loadBoom();
  if(!boomSample(scale)) boomSound(scale);
};

renderChips();

buildTable();
fitCanvas();
requestAnimationFrame(draw);
select(27);
