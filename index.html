    background:var(--bg);color:var(--text);
    font-family:'Orbit','Segoe UI',system-ui,sans-serif;
    overflow:hidden;display:flex;flex-direction:column;
  }

  header{
    padding:14px 22px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex-shrink:0;
  }
  header h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  header .sub{font-size:12px;color:var(--dim)}
  header .legend{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
  .lg{
    font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;
    border:1px solid transparent;background:rgba(255,255,255,.04);
    color:var(--dim);font-family:inherit;
  }
  .lg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .lg[aria-pressed="true"]{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.09)}

  main{flex:1;display:flex;min-height:0}

  /* ── 표 ── */
  #tableWrap{flex:1;overflow:auto;padding:14px 18px 22px}
  #tableWrap::-webkit-scrollbar{width:9px;height:9px}
  #tableWrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

  #grid{
    display:grid;
    grid-template-columns:26px repeat(18, minmax(46px,1fr));
    gap:3px;min-width:900px;
  }
  .ghead,.phead{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--dim);cursor:pointer;
    border-radius:4px;user-select:none;
  }
  .ghead{height:20px}
  .phead{font-variant-numeric:tabular-nums}
  .ghead:hover,.phead:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .ghead.on,.phead.on{color:#0b0d11;background:var(--text);font-weight:700}

  .cell{
    position:relative;aspect-ratio:1/1;min-height:44px;
    border:1px solid var(--line);border-radius:5px;
    background:var(--panel);cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:2px;overflow:hidden;
  }
  .cell .num{
    position:absolute;top:3px;left:5px;font-size:9px;color:var(--dim);
    font-variant-numeric:tabular-nums;
  }
  .cell .sym{font-size:17px;font-weight:700;line-height:1;margin-top:4px}
  .cell .ko{font-size:9px;color:var(--dim);margin-top:3px;text-align:center;
    line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--cc);
  }
  .cell:hover{border-color:var(--cc);background:#1b212b}
  .cell.sel{border-color:var(--cc);background:#202834;box-shadow:0 0 0 1px var(--cc)}
  .cell.dim{opacity:.16}
  .cell.hl{background:#232c3a}

  .note{
    grid-column:span 1;display:flex;align-items:center;justify-content:center;
    font-size:9px;color:var(--dim);border:1px dashed var(--line2);
    border-radius:5px;aspect-ratio:1/1;min-height:44px;
  }
  .spacer{aspect-ratio:1/1;min-height:44px}
  .rowgap{grid-column:1 / -1;height:10px}

  /* ── 상세 ── */
  #detail{
    width:330px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;overflow:hidden;
  }
  #atomBox{
    height:270px;flex-shrink:0;position:relative;
    border-bottom:1px solid var(--line);background:#0b0d11;
  }
  #atom{width:100%;height:100%;display:block}
  @keyframes quake{
    0%{transform:translate(0,0)}
    15%{transform:translate(-5px,3px)}
    30%{transform:translate(4px,-4px)}
    45%{transform:translate(-3px,-2px)}
    60%{transform:translate(3px,2px)}
    75%{transform:translate(-2px,1px)}
    100%{transform:translate(0,0)}
  }
  #atomBox.quake{animation:quake .32s ease-out}
  @keyframes pop{
    0%{transform:scale(1)}
    35%{transform:scale(.9)}
    70%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }
  .cell.pop{animation:pop .26s ease-out}
  #atomTag{
    position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--dim);
  }
  #atomTag b{color:var(--text);font-weight:600}

  #info{flex:1;overflow-y:auto;padding:16px 20px 24px}
  #info::-webkit-scrollbar{width:8px}
  #info::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

  .bigsym{font-size:44px;font-weight:800;line-height:1;color:var(--cc)}
  .names{margin-top:6px}
  .names .k{font-size:19px;font-weight:650}
  .names .e{font-size:12px;color:var(--dim);margin-top:2px}

  .cat{
    display:inline-block;margin-top:11px;font-size:11px;padding:3px 9px;
    border-radius:4px;background:rgba(255,255,255,.06);
    border:1px solid var(--cc);color:var(--cc);
  }

  .rows{margin-top:16px;border-top:1px solid var(--line)}
  .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .r span:first-child{color:var(--dim)}
  .r span:last-child{font-variant-numeric:tabular-nums}

  .shellTitle{font-size:12px;color:var(--dim);margin:16px 0 8px}
  .shells{display:flex;flex-direction:column;gap:5px}
  .sh{display:flex;align-items:center;gap:9px;font-size:12px}
  .sh .lbl{width:16px;color:var(--dim);text-align:center}
  .sh .bar{
    flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;
  }
  .sh .bar i{display:block;height:100%;background:var(--cc);border-radius:4px}
  .sh .cnt{width:22px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}

  #empty{padding:40px 24px;color:var(--dim);font-size:13px;line-height:1.7;text-align:center}

  @media (max-width:900px){
    main{flex-direction:column}
    #detail{width:100%;border-left:none;border-top:1px solid var(--line);height:52%}
    #tableWrap{height:48%}
    #atomBox{height:190px}
  }

  /* ── 조합 트레이 ── */
  footer#tray{
    flex-shrink:0;border-top:1px solid var(--line);background:var(--panel);
    padding:10px 18px;display:flex;align-items:center;gap:12px;min-height:58px;
  }
  #trayLabel{font-size:12px;color:var(--dim);flex-shrink:0}
  #chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-height:28px;align-items:center}
  #chips .ph{font-size:12px;color:var(--dim);opacity:.6}
  .chip{
    display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;
    padding:4px 10px;border-radius:5px;background:rgba(255,255,255,.06);
    border:1px solid var(--line2);cursor:pointer;user-select:none;
  }
  .chip .n{font-size:11px;color:var(--dim);font-weight:400}
  .chip .mi,.chip .pl{
    font-size:13px;line-height:1;color:var(--dim);padding:1px 3px;border-radius:3px;
  }
  .chip .mi:hover{background:rgba(255,135,135,.22);color:#ff8787}
  .chip .pl:hover{background:rgba(120,200,255,.22);color:#74c0fc}
  #chips .cnt{font-size:11px;color:var(--dim);margin-left:2px;flex-shrink:0}
  .btn{
    font-size:12.5px;font-weight:650;padding:8px 16px;border-radius:6px;
    border:none;cursor:pointer;font-family:inherit;flex-shrink:0;
  }
  #mixBtn{background:var(--text);color:#0b0d11}
  #mixBtn:disabled{background:#2b3341;color:#5a6472;cursor:default}
  #clearBtn{background:transparent;border:1px solid var(--line2);color:var(--dim)}

  /* ── 결과 모달 ── */
  #modal{
    position:fixed;inset:0;background:rgba(5,7,10,.82);z-index:50;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #modal.on{display:flex}
  #card{
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;
    padding:30px 34px 26px;max-width:430px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #card .eq{font-size:12px;color:var(--dim);letter-spacing:.04em}
  #card .formula{font-size:34px;font-weight:800;margin:12px 0 4px;letter-spacing:-.01em}
  #card .cname{font-size:21px;font-weight:700}
  #card .csub{font-size:14px;color:var(--dim);margin-top:12px;line-height:1.6}
  #card .fail{color:#ff8787}
  #card .close{margin-top:22px;background:var(--text);color:#0b0d11}
  #card .badge{
    display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:4px;
    background:rgba(255,255,255,.07);border:1px solid var(--line2);
    color:var(--dim);margin-bottom:4px;
  }

  .subtitle{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5;font-style:italic}
  .subtitle2{
    font-size:11.5px;color:#5f6a7a;margin-top:5px;line-height:1.45;
    padding-left:9px;border-left:2px solid var(--line2);
  }
  .subtitle3{
    font-size:11px;color:#4e586a;margin-top:4px;line-height:1.4;
    padding-left:9px;margin-left:9px;border-left:2px solid #2b3341;
  }
  #addBtn{
    width:100%;margin-top:16px;background:transparent;
    border:1px dashed var(--line2);color:var(--dim);padding:10px;
  }
  #addBtn:hover{border-color:var(--cc);color:var(--cc)}

  /* ── 융합 애니메이션 ── */
  #fuse{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(5,7,11,.72);
  }
  #fuse.on{display:block}
  #fuseCv{width:100%;height:100%;display:block}

  /* ── 검색 / 툴 ── */
  #tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  #search{
    background:#10141b;border:1px solid var(--line2);border-radius:6px;
    color:var(--text);padding:6px 10px;font-size:12.5px;font-family:inherit;width:150px;
  }
  #search:focus{outline:none;border-color:#4dabf7}
  #search::placeholder{color:#4d566a}
  .tbtn{
    font-size:11.5px;padding:6px 10px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--dim);font-family:inherit;
  }
  .tbtn:hover{color:var(--text)}
  .tbtn[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--text)}

  .cell.tox{box-shadow:inset 0 0 0 1px #ff6b6b}
  .cell.tox::before{
    content:"☠";position:absolute;top:2px;right:4px;font-size:9px;color:#ff6b6b;
  }
  .cell.found{outline:1px solid rgba(120,200,255,.25)}

  /* ── 표 흔들림 ── */
  @keyframes quake{
    0%{transform:translate(0,0)}   12%{transform:translate(-9px,4px)}
    25%{transform:translate(8px,-5px)} 37%{transform:translate(-7px,-3px)}
    50%{transform:translate(6px,5px)}  62%{transform:translate(-5px,2px)}
    75%{transform:translate(3px,-2px)} 87%{transform:translate(-2px,1px)}
    100%{transform:translate(0,0)}
  }
  .quaking{animation:quake .6s ease-out}

  /* ── 도감 ── */
  #dex{
    position:fixed;inset:0;background:rgba(6,8,12,.85);z-index:55;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #dex.on{display:flex}
  #dexBox{
    width:min(760px,94vw);max-height:84vh;background:var(--panel);
    border:1px solid var(--line2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;
  }
  #dexHead{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:12px;
  }
  #dexHead h2{font-size:17px;font-weight:700}
  #dexHead .cnt{font-size:12px;color:var(--dim)}
  #dexHead .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px;line-height:1}
  #dexHead .x:hover{color:var(--text)}
  #dexList{overflow-y:auto;padding:12px 16px 20px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  #dexList::-webkit-scrollbar{width:8px}
  #dexList::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .dx{
    border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:#10141b;
  }
  .dx .f{font-size:12px;color:#4dabf7;font-variant-numeric:tabular-nums}
  .dx .n{font-size:14px;font-weight:650;margin-top:2px}
  .dx .s{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4}
  .dx.locked{opacity:.4}
  .dx.locked .n{color:var(--dim)}
  .dx .hint{font-size:10.5px;color:#4d566a;margin-top:3px;letter-spacing:.04em}

  /* ══════════ 모바일 ══════════ */
  @media (max-width:700px){
    body{-webkit-text-size-adjust:100%}

    header{padding:9px 12px 8px;gap:8px}
    header h1{font-size:16px}
    header .sub{display:none}

    /* 범례: 한 줄로 가로 스크롤 */
    .legend{
      order:3;width:100%;margin-left:0;flex-wrap:nowrap;
      overflow-x:auto;padding-bottom:2px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .legend::-webkit-scrollbar{display:none}
    .lg{flex-shrink:0;font-size:10.5px;padding:4px 7px}

    #tools{order:2;margin-left:auto;gap:6px}
    #search{width:110px;font-size:16px;padding:5px 8px}  /* 16px: iOS 확대 방지 */
    .tbtn{font-size:11px;padding:5px 8px}

    /* 표: 칸 줄이고 기호만 */
    #tableWrap{padding:10px 10px 14px;height:44%}
    #grid{
      grid-template-columns:16px repeat(18, minmax(30px,1fr));
      gap:2px;min-width:600px;
    }
    .cell{min-height:30px;border-radius:4px;padding:1px}
    .cell .num{font-size:7px;top:1px;left:2px}
    .cell .sym{font-size:12px;margin-top:2px}
    .cell .ko{display:none}
    .cell::after{height:1.5px}
    .note{min-height:30px;font-size:7.5px}
    .spacer{min-height:30px}
    .ghead,.phead{font-size:9px}
    .ghead{height:15px}

    /* 상세 */
    #detail{height:56%}
    #atomBox{height:150px}
    #info{padding:12px 14px 20px}
    .bigsym{font-size:34px}
    .names .k{font-size:17px}
    .r{padding:7px 0;font-size:12.5px}

    /* 트레이 */
    footer#tray{
      padding:8px 10px;gap:7px;min-height:50px;flex-wrap:wrap;
    }
    #trayLabel{display:none}
    #chips{
      order:1;width:100%;flex-wrap:nowrap;overflow-x:auto;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;
    }
    #chips::-webkit-scrollbar{display:none}
    .chip{flex-shrink:0}
    footer#tray .btn,footer#tray button{order:2;flex:1;font-size:12px;padding:8px 6px}

    /* 도감 */
    #dex{padding:12px}
    #dexBox{max-height:88vh}
    #dexList{grid-template-columns:1fr;gap:6px}
    #dexHead{padding:12px 14px}
    #dexHead h2{font-size:15px}

    /* 결과 카드 */
    #card{padding:22px 20px 18px}
  }

  /* 아주 좁은 화면 */
  @media (max-width:380px){
    #grid{grid-template-columns:14px repeat(18, minmax(26px,1fr));min-width:520px}
    .cell{min-height:26px}
    .cell .sym{font-size:11px}
    #search{width:88px}
  }

  /* 가로 모드 */
  @media (max-width:900px) and (orientation:landscape){
    main{flex-direction:row}
    #tableWrap{height:auto;flex:1}
    #detail{width:44%;height:auto;border-left:1px solid var(--line);border-top:none}
    #atomBox{height:120px}
  }

  /* 터치 기기: hover 효과 제거 */
  @media (hover:none){
    .cell:hover{border-color:var(--line);background:var(--panel)}
    .cell:active{background:#202834}
    .lg:hover,.tbtn:hover{color:inherit}
  }

  sub,sup{font-size:.62em;line-height:0;position:relative;font-variant-numeric:normal}
  sub{bottom:-.22em}
  sup{top:-.42em}
  .formula sub,.formula sup{font-size:.58em}

  /* ══════════ 퀴즈 ══════════ */
  #quiz{
    position:fixed;inset:0;background:rgba(6,8,12,.86);z-index:58;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #quiz.on{display:flex}
  #qBox{
    width:min(520px,94vw);max-height:88vh;background:var(--panel);
    border:1px solid var(--line2);border-radius:12px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  #qHead{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  #qHead h2{font-size:16px;font-weight:700}
  #qHead .qprog,#qHead .qsc,#qHead .qst{font-size:11.5px;color:var(--dim)}
  #qHead .qsc b,#qHead .qst b{color:var(--text);font-weight:650}
  #qHead .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:19px;line-height:1}
  #qHead .x:hover{color:var(--text)}

  #qBody{padding:18px 20px 22px;overflow-y:auto}
  #qBody::-webkit-scrollbar{width:8px}
  #qBody::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

  /* 설정 */
  .qsl{font-size:11.5px;color:var(--dim);margin:14px 0 7px}
  .qsl:first-child{margin-top:0}
  .qrow{display:flex;gap:6px;flex-wrap:wrap}
  .qpick{
    font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--dim);font-family:inherit;
  }
  .qpick:hover{color:var(--text)}
  .qpick.on{background:var(--text);color:#0b0d11;border-color:var(--text);font-weight:650}
  .qbestline{font-size:11.5px;color:#5f6a7a;margin:18px 0 10px}
  #qGo{width:100%;background:var(--text);color:#0b0d11;padding:12px}

  /* 문제 */
  .qlabel{font-size:11.5px;color:var(--dim);text-align:center}
  .qprompt{
    font-size:26px;font-weight:700;text-align:center;margin:12px 0 22px;
    line-height:1.25;word-break:keep-all;
  }
  .qprompt.big{font-size:62px;letter-spacing:-.02em;margin:8px 0 24px}
  .qopts{display:flex;flex-direction:column;gap:8px}
  .qopt{
    font-size:14px;padding:13px 16px;border-radius:7px;cursor:pointer;text-align:left;
    border:1px solid var(--line2);background:#10141b;color:var(--text);font-family:inherit;
  }
  .qopt:hover:not(:disabled){border-color:var(--text);background:#1b212b}
  .qopt:disabled{cursor:default;opacity:.5}
  .qopt.right{border-color:#69db7c;background:rgba(105,219,124,.14);color:#8ce99a;opacity:1}
  .qopt.bad{border-color:#ff6b6b;background:rgba(255,107,107,.13);color:#ff8787;opacity:1}

  .qfeed{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:1px}
  .qfeed .good{color:#8ce99a;font-size:14px;font-weight:650}
  .qfeed .bad{color:#ff8787;font-size:14px;font-weight:650}
  .qfeed .ansis{font-size:12.5px;color:var(--dim)}
  .qfeed .ansis b{color:var(--text)}
  #qNext{margin-left:auto;background:var(--text);color:#0b0d11}

  /* 결과 */
  .qscore{font-size:52px;font-weight:800;text-align:center;line-height:1}
  .qscore span{font-size:20px;color:var(--dim);font-weight:600;margin-left:6px}
  .qpct{text-align:center;font-size:15px;color:var(--dim);margin-top:8px}
  .qpct em{color:#ffd43b;font-style:normal;font-weight:700;margin-left:6px}
  .qmeta{text-align:center;font-size:11.5px;color:#5f6a7a;margin-top:6px}
  .qperfect{text-align:center;font-size:13px;color:#8ce99a;margin:22px 0}
  .qwtitle{font-size:11.5px;color:var(--dim);margin:22px 0 8px;
    border-top:1px solid var(--line);padding-top:16px}
  .qwlist{display:flex;flex-direction:column;gap:5px}
  .qw{display:flex;align-items:baseline;gap:10px;font-size:12.5px;
    background:#10141b;border:1px solid var(--line);border-radius:6px;padding:8px 11px}
  .qw .s{font-weight:700;width:34px;flex-shrink:0}
  .qw .n{flex:1}
  .qw .a{color:#8ce99a;font-size:11.5px;text-align:right}
  .qbtns{display:flex;gap:8px;margin-top:20px}
  .qbtns .btn{flex:1;background:var(--text);color:#0b0d11;padding:12px}

    cursor:pointer;border:1px solid var(--line2);background:#10141b;

  .fchip.on{background:var(--text);color:#0b0d11;font-weight:700}

  /* ══════════ 문제 풀 때는 뒤를 가린다 ══════════ */

  /* ══════════ 설정으로 옮긴 버튼은 헤더에서 숨김 ══════════ */
  #toxBtn, #safeBtn, #langBtn, #sndBtn{display:none !important}

  /* ══════════ 설정 패널 ══════════ */

  }

  /* ══════════════════════════════════════════════════
     모바일 보정
     기존 모바일 규칙 일부가 명시도에 밀려 적용되지 않던 것을 바로잡음.
     미디어 쿼리는 명시도를 올려주지 않으므로 선택자를 같은 수준으로 맞춰야 함.
     ══════════════════════════════════════════════════ */
  @media (max-width:700px){

    /* 기본값이 `header .legend{flex-wrap:wrap}` 라 `.legend` 로는 못 이김.
       그래서 범례가 계속 세 줄로 접혀 화면 위쪽을 크게 잡아먹고 있었음 */
    header .legend{
      order:3;width:100%;margin-left:0;
      flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    header .legend::-webkit-scrollbar{display:none}
    header .legend .lg{flex-shrink:0;font-size:10.5px;padding:4px 7px}

    /* `#chips{flex:1}` 이 flex-basis:0 을 만들어 width:100% 가 무시됨.
       basis 를 직접 100% 로 줘야 한 줄을 온전히 차지함 */
    footer#tray #chips{flex:1 1 100%;width:auto;min-width:0}
    footer#tray #chips .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* 모드 바도 한 줄에 */
    #modebar{padding:6px 10px;gap:8px}
    #mtabs .mbtn{font-size:11px;padding:4px 9px}

    /* 범례에서 아낀 두 줄을 표에 돌려줌 */
    #tableWrap{height:50%}
    #detail{height:50%}
    #atomBox{height:132px}

    /* 원자 모형을 끄면 #atomBox 가 사라지므로
       그 공간은 같은 부모 안의 정보 영역이 자동으로 물려받는다.
       높이를 따로 건드리면 오히려 표가 흔들림 */
  }

  /* 아주 좁은 화면.
     360px(갤럭시)·375px(아이폰 SE)는 흔한 크기라 여기 걸리면 안 됨 */
  @media (max-width:320px){

  #chips .ph{transition:color .15s}
  body.mode-add #chips .ph{color:var(--text);opacity:.85}

    #qtyBox{height:30px}
    #qtyBox button{width:24px}
    #qtyN{width:34px;font-size:12px}
    #qtyNote{font-size:10px;width:100%;order:9}
  }

  /* ══════════ 배경 발광 ══════════ */
  #glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    overflow:hidden;opacity:0;transition:opacity .5s ease;
  }
  body.bg-on #glow{opacity:1}
  #glow i{
    position:absolute;display:block;border-radius:50%;
    background:var(--cc, #7f8a9b);
    filter:blur(70px);opacity:.15;
    transition:background .55s ease;
    will-change:transform;
  }
  #glow i:nth-child(1){
    width:62vmax;height:62vmax;left:-16vmax;top:-22vmax;
    animation:drift1 38s ease-in-out infinite alternate;
  }
  #glow i:nth-child(2){
    width:48vmax;height:48vmax;right:-14vmax;bottom:-20vmax;
    opacity:.11;
    animation:drift2 46s ease-in-out infinite alternate;
  }
  @keyframes drift1{
    from{transform:translate3d(0,0,0) scale(1)}
    to  {transform:translate3d(7vmax,4vmax,0) scale(1.14)}
  }
  @keyframes drift2{
    from{transform:translate3d(0,0,0) scale(1.08)}
    to  {transform:translate3d(-6vmax,-5vmax,0) scale(1)}
  }
  /* 움직임을 줄여달라고 한 기기에서는 흐르지 않게 */
  body.bg-still #glow i{animation:none}
  @media (prefers-reduced-motion: reduce){
    #glow i{animation:none !important}

  /* 반대 방향으로 흐르는 줄 */

  #achbox{

<body>

<header>
  <h1>주기율표</h1>
  <span class="sub">원소를 누르면 원자 모형이 나옴 · 족/주기 번호를 누르면 강조</span>
  <div class="legend" id="legend"></div>
  <div id="tools">
    <input id="search" placeholder="원소 검색…" autocomplete="off">
    <button class="tbtn" id="toxBtn" aria-pressed="false">☠ 독성</button>
    <button class="tbtn" id="dexBtn">도감</button>
    <button class="tbtn" id="quizBtn">학습</button>
    <button class="tbtn" id="safeBtn" aria-pressed="false">순화</button>
    <button class="tbtn" id="langBtn">EN</button>
    <button class="tbtn" id="setBtn" title="설정">⚙</button>
    <button class="tbtn" id="sndBtn" aria-pressed="true">🔊</button>
  </div>
</header>

<div id="modebar">
  <div id="mtabs"></div>
  <div id="mopt"></div>
</div>

<main>
  <div id="tableWrap"><div id="grid"></div></div>
  <aside id="detail">
    <div id="atomBox"><canvas id="atom"></canvas><div id="atomTag"></div></div>
    <div id="info"><div id="empty">원소를 선택하세요</div></div>
  </aside>
</main>

<footer id="tray">
  <span id="trayLabel">조합</span>
  <div id="chips"><span class="ph">원소를 담아보세요</span></div>
  <button class="btn" id="addModeBtn" aria-pressed="false">＋ 담기</button>
  <span id="qtyBox">
    <button type="button" id="qtyDn" aria-label="줄이기">−</button>
    <input id="qtyN" type="number" min="1" max="55" step="1" value="1" inputmode="numeric">
    <button type="button" id="qtyUp" aria-label="늘리기">＋</button>
  </span>
  <span id="qtyNote">55개가 최대입니다</span>
  <button class="btn" id="randBtn" style="background:#2a3342;color:var(--text)">랜덤</button>
  <button class="btn" id="clearBtn">비우기</button>
  <button class="btn" id="mixBtn" disabled>조합하기</button>
</footer>


<div id="dex"><div id="dexBox">
  <div id="dexHead">
    <h2 id="dexTitle">조합 도감</h2>
    <span class="cnt" id="dexCnt"></span>
    <span class="x" id="dexClose">×</span>
    <span id="w95btns">
      <button type="button" data-w="min" aria-label="최소화">_</button>
      <button type="button" data-w="max" aria-label="최대화">□</button>
      <button type="button" data-w="close" aria-label="닫기">✕</button>
    </span>
  </div>
  <div id="achRow"></div>
<div id="dexList"></div>
</div></div>

<div id="settings"><div id="setBox">
  <div id="setHead"><h2 id="setTitle">설정</h2><span class="x" id="setClose">×</span></div>
  <div id="setBody"></div>
</div></div>

<div id="qBar"></div>

<div id="quiz"><div id="qBox">
  <div id="qHead"></div>
  <div id="qBody"></div>
</div></div>

<div id="fuse"><canvas id="fuseCv"></canvas></div>

<div id="modal">
  <div id="card">
    <div class="eq" id="mEq"></div>
    <div class="formula" id="mFormula"></div>
    <div class="cname" id="mName"></div>
    <div class="csub" id="mSub"></div>
    <div class="cdex" id="mDex"></div>
    <div class="cbtns">
      <button class="btn" id="mWipe">비우고 계속</button>
      <button class="btn close" id="mClose">닫기</button>
    </div>
  </div>
</div>

  post:{ko:"전이후 금속",v:"--post"},
  metalloid:{ko:"준금속",v:"--metalloid"},
  nonmetal:{ko:"비금속",v:"--nonmetal"},
  halogen:{ko:"할로젠",v:"--halogen"},
  noble:{ko:"비활성 기체",v:"--noble"},
  lanthanide:{ko:"란타넘족",v:"--lanthanide"},

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let selected = null;
let hlGroup = null, hlPeriod = null;
let catFilter = new Set();

/* ═══ 표 그리기 ═══ */
const grid = document.getElementById('grid');
const byNum = {};
EL.forEach(e => byNum[e.n] = e);

function makeCell(e){
  const d = document.createElement('div');
  d.className = 'cell';
  d.dataset.n = e.n;
  d.style.setProperty('--cc', cssv(CAT[e.c].v));
  d.innerHTML = `<span class="num">${e.n}</span>
    <span class="sym">${e.s}</span>
    <span class="ko">${e.ko}</span>`;
  d.addEventListener('click', () => {
    select(e.n);
    d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop');
  });
  return d;
}

function buildTable(){
  grid.innerHTML = '';

  // 족 헤더
  grid.appendChild(Object.assign(document.createElement('div'),{className:'ghead'}));
  for(let g=1; g<=18; g++){
    const h = document.createElement('div');
    h.className = 'ghead'; h.textContent = g; h.dataset.g = g;
    h.addEventListener('click', () => { hlGroup = (hlGroup===g? null : g); hlPeriod=null; paint(); });
    grid.appendChild(h);
  }

  // 1~7 주기
  for(let p=1; p<=7; p++){
    const ph = document.createElement('div');
    ph.className = 'phead'; ph.textContent = p; ph.dataset.p = p;
    ph.addEventListener('click', () => { hlPeriod = (hlPeriod===p? null : p); hlGroup=null; paint(); });
    grid.appendChild(ph);

    for(let g=1; g<=18; g++){
      const e = EL.find(x => x.p===p && x.g===g);
      if(e){ grid.appendChild(makeCell(e)); continue; }

      if((p===6||p===7) && g===3){
        const n = document.createElement('div');
        n.className = 'note';
        n.textContent = p===6 ? '57–71' : '89–103';
        n.addEventListener('click', () => select(p===6?57:89));
        n.style.cursor = 'pointer';
        grid.appendChild(n);
        continue;
      }
      grid.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
    }
  }

  grid.appendChild(Object.assign(document.createElement('div'),{className:'rowgap'}));

  // 란타넘족 / 악티늄족
  [[57,71],[89,103]].forEach(([a,b]) => {
    grid.appendChild(Object.assign(document.createElement('div'),{className:'phead'}));
    grid.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
    grid.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
    for(let n=a; n<=b; n++) grid.appendChild(makeCell(byNum[n]));
    // 그리드가 19칸(주기라벨 1 + 족 18)이라 줄을 정확히 채워야
    // 다음 줄이 한 칸씩 밀리지 않음
    grid.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
  });
}

var query = '', toxOn = false;

function paint(){
  document.querySelectorAll('.ghead').forEach(h =>
    h.classList.toggle('on', hlGroup!==null && +h.dataset.g===hlGroup));
  document.querySelectorAll('.phead').forEach(h =>
    h.classList.toggle('on', hlPeriod!==null && +h.dataset.p===hlPeriod));

  document.querySelectorAll('.cell').forEach(c => {
    const e = byNum[+c.dataset.n];
    let dim = false, hl = false;

    if(catFilter.size && !catFilter.has(e.c)) dim = true;
    if(query && !matchQuery(e)) dim = true;
    c.classList.toggle('tox', toxOn && isToxic(e));
    if(hlGroup !== null){ if(e.g === hlGroup) hl = true; else dim = true; }
    if(hlPeriod !== null){ if(e.p === hlPeriod) hl = true; else dim = true; }

    c.classList.toggle('dim', dim);
    c.classList.toggle('hl', hl && !dim);
    c.classList.toggle('sel', selected === e.n);
  });
}

/* ═══ 범례 ═══ */
const legend = document.getElementById('legend');
Object.entries(CAT).forEach(([k,v]) => {
  const b = document.createElement('button');
  b.className = 'lg'; b.setAttribute('aria-pressed','false');
  b.innerHTML = `<i style="background:${cssv(v.v)}"></i>${v.ko}`;
  b.addEventListener('click', () => {
    if(catFilter.has(k)) catFilter.delete(k); else catFilter.add(k);
    b.setAttribute('aria-pressed', catFilter.has(k));
    paint();
  });
  legend.appendChild(b);
});

const info = document.getElementById('info');
const atomTag = document.getElementById('atomTag');

function select(n){
  selected = n;
  const e = byNum[n];
  const col = cssv(CAT[e.c].v);
  document.documentElement.style.setProperty('--cc', col);

  const maxSh = Math.max(...e.sh);
  const shellNames = ['K','L','M','N','O','P','Q'];

  info.innerHTML = `
    <div class="bigsym" style="color:${col}">${e.s}</div>
    <div class="names">
      <div class="k">${e.ko}</div>
      <div class="e">${e.en}</div>
      <div class="subtitle">${SUB[e.s] || SUB_FALLBACK[e.c] || "설명 준비 중"}</div>
      ${SUB2[e.s] ? `<div class="subtitle2">${SUB2[e.s]}</div>` : ""}
      ${SUB3[e.s] ? `<div class="subtitle3">${SUB3[e.s]}</div>` : ""}
    </div>
    <span class="cat" style="color:${col};border-color:${col}">${CAT[e.c].ko}</span>
    <div class="rows">
      <div class="r"><span>원자번호</span><span>${e.n}</span></div>
      <div class="r"><span>원자량</span><span>${e.m}</span></div>
      <div class="r"><span>족</span><span>${e.g ?? (e.c==='lanthanide'?'란타넘족':'악티늄족')}</span></div>
      <div class="r"><span>주기</span><span>${e.p}</span></div>
      <div class="r"><span>전자 배치</span><span>${e.sh.join(', ')}</span></div>
    </div>
    <div class="shellTitle">전자껍질</div>
    <div class="shells">
      ${e.sh.map((c,i)=>`
        <div class="sh">
          <span class="lbl">${shellNames[i]}</span>
          <span class="bar"><i style="width:${c/maxSh*100}%;background:${col}"></i></span>
          <span class="cnt">${c}</span>
        </div>`).join('')}
    </div>
    <button class="btn" id="addBtn">조합에 담기  +</button>`;

  const ab = document.getElementById('addBtn');
  if(ab) ab.addEventListener('click', () => addToMix(e.n));

  const neutrons = Math.round(e.m) - e.n;
  atomTag.innerHTML = `양성자 <b>${e.n}</b> · 중성자 <b>${neutrons}</b> · 전자 <b>${e.n}</b>`;

  startAtom(e, col);
  paint();

  // 모바일: 고른 원소 정보가 바로 보이게
  if(innerWidth <= 700){
    const inf = document.getElementById('info');
    if(inf) inf.scrollTop = 0;
  }
}

/* ═══ 원자 모형 ═══ */
const cv = document.getElementById('atom');
const ctx = cv.getContext('2d');
let atomEl = null, atomCol = '#fff', t0 = performance.now();
let shakeHit = 0;        // 선택 순간 충격 (감쇠)
let instab = 0;          // 원소 불안정도 (상시 진동)

// 방사성 원소는 상시로 떨림
const RADIO = new Set([43,61]);
function instabilityOf(e){
  if(e.n > 103) return 1.0;            // 초중원소
  if(e.n > 94)  return 0.75;
  if(e.n > 83)  return 0.5;            // 비스무트 이후
  if(RADIO.has(e.n)) return 0.4;       // 테크네튬 / 프로메튬
  return 0;
}

function fitCanvas(){
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => setTimeout(fitCanvas, 250));

function startAtom(e, col){
  atomEl = e; atomCol = col;
  shakeHit = 1;
  instab = instabilityOf(e);
  cv.parentElement.classList.remove('quake');
  void cv.parentElement.offsetWidth;
  cv.parentElement.classList.add('quake');
}

function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}

function draw(now){
  requestAnimationFrame(draw);
  const w = cv.width / (devicePixelRatio>2?2:devicePixelRatio);
  const h = cv.height / (devicePixelRatio>2?2:devicePixelRatio);
  ctx.clearRect(0,0,w,h);
  if(!atomEl) return;

  const t = (now - t0) / 1000;

  // ── 흔들림 ──
  shakeHit *= 0.90;
  if(shakeHit < 0.001) shakeHit = 0;
  const amp = shakeHit * 9 + instab * 1.6;
  const sx = amp ? (Math.sin(t*47.3)*0.6 + Math.sin(t*91.7)*0.4) * amp : 0;
  const sy = amp ? (Math.cos(t*53.9)*0.6 + Math.cos(t*83.1)*0.4) * amp : 0;
  ctx.save();
  ctx.translate(sx, sy);

  const cx = w/2, cy = h/2;
  const [R,G,B] = hex2rgb(atomCol);
  const rgba = a => `rgba(${R},${G},${B},${a})`;

  const shells = atomEl.sh;
  const maxR = Math.min(w,h)/2 - 16;
  const minR = 30;

  // 껍질 궤도
  shells.forEach((cnt, i) => {
    const rr = minR + (maxR - minR) * (shells.length===1 ? 0.55 : i/(shells.length-1));
    ctx.beginPath();
    ctx.ellipse(cx, cy, rr, rr*0.42, 0, 0, Math.PI*2);
    ctx.strokeStyle = rgba(0.16);
    ctx.lineWidth = 1;
    ctx.stroke();

    // 전자
    const speed = 0.55 / (i*0.45 + 1);
    const dir = i % 2 ? -1 : 1;
    const er = cnt > 20 ? 1.5 : (cnt > 10 ? 2 : 2.8);
    for(let k=0; k<cnt; k++){
      const a = t*speed*dir + (k / cnt) * Math.PI*2;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr * 0.42;
      const front = Math.sin(a) > 0;
      ctx.beginPath();
      ctx.arc(x, y, er, 0, Math.PI*2);
      ctx.fillStyle = front ? rgba(0.95) : rgba(0.4);
      ctx.fill();
    }
  });

  // 핵
  const nP = atomEl.n;
  const nN = Math.max(0, Math.round(atomEl.m) - atomEl.n);
  const total = nP + nN;
  const coreR = Math.min(22, 5 + Math.sqrt(total) * 1.5);

  ctx.beginPath();
  ctx.arc(cx, cy, coreR*1.9, 0, Math.PI*2);
  const gl = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*1.9);
  gl.addColorStop(0, rgba(0.5));
  gl.addColorStop(1, rgba(0));
  ctx.fillStyle = gl; ctx.fill();

  const show = Math.min(total, 60);
  for(let k=0; k<show; k++){
    const ga = k * 2.399963;
    const rr = coreR * Math.sqrt(k/show);
    const jit = 0.9 + instab * 2.6 + shakeHit * 3;
    const wob = Math.sin(t*(1.4 + instab*9) + k) * jit;
    const x = cx + Math.cos(ga + t*0.15) * rr + wob;
    const y = cy + Math.sin(ga + t*0.15) * rr + wob;
    ctx.beginPath();
    ctx.arc(x, y, 2.6, 0, Math.PI*2);
    ctx.fillStyle = (k % 2 === 0) ? rgba(0.95) : 'rgba(190,200,215,.75)';
    ctx.fill();
  }

  // 기호
  ctx.restore();

  ctx.font = '600 13px Orbit, system-ui, sans-serif';
  ctx.fillStyle = rgba(0.85);
  ctx.textAlign = 'left';
  ctx.fillText(atomEl.s, 12, 24);

  if(instab > 0){
    ctx.font = '600 10px Orbit, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,140,140,.85)';
    ctx.textAlign = 'right';
    ctx.fillText('UNSTABLE', w - 12, 24);
  }
}

  C:  [[2,9,"C","흑연","연필심 / 미끌미끌함"],
       [10,99,"C","다이아몬드","존나 비싼 숯"]],

  H:  [[2,2,"H₂","수소 기체","제일 가벼운 기체"],
       [3,99,"H","수소 덩어리","이 정도면 별이 될지도"]],

function singleResult(sym, cnt){
  const t = SINGLE[sym];
  if(t){
    for(const [a,b,f,n,sub] of t){
      if(cnt >= a && cnt <= b) return [f, n, sub];
    }
  }
  const e = EL.find(x => x.s === sym);
  return [sym, `${e ? e.ko : sym} 덩어리`, `${cnt}개 모아봤자 그냥 ${e ? e.ko : sym}임`];
}

/* 화학식의 유니코드 아래/위첨자를 <sub>/<sup> 로 */
const SUBMAP = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4',
                '₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
const SUPMAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5',
                '⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'−'};
function fmtFormula(str){
  if(!str) return '';
  let out = '', mode = null, buf = '';
  const flush = () => {
    if(!buf) return;
    out += mode === 'sub' ? `<sub>${buf}</sub>` : `<sup>${buf}</sup>`;
    buf = '';
  };
  for(const ch of String(str)){
    if(SUBMAP[ch]){
      if(mode !== 'sub'){ flush(); mode = 'sub'; }
      buf += SUBMAP[ch];
    } else if(SUPMAP[ch]){
      if(mode !== 'sup'){ flush(); mode = 'sup'; }
      buf += SUPMAP[ch];
    } else {
      flush(); mode = null;
      out += ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  }
  flush();
  return out;
}

const MIX_MAX = 55;

function renderChips(){
  if(!mix.length){
    chipsEl.innerHTML = `<span class="ph">원소를 담아보세요 (최대 ${MIX_MAX}개)</span>`;
    mixBtn.disabled = true;
    return;
  }

  // 같은 원소끼리 묶기 (처음 담은 순서 유지)
  const order = [], cnt = {};
  mix.forEach(n => { if(cnt[n] === undefined){ order.push(n); cnt[n] = 0; } cnt[n]++; });

  chipsEl.innerHTML = order.map(n => {
    const e = byNum[n];
    return `<span class="chip" data-n="${n}" style="color:${cssv(CAT[e.c].v)}">
      <span class="mi" data-act="minus">−</span>
      ${e.s}<span class="n">×${cnt[n]}</span>
      <span class="pl" data-act="plus">＋</span>
    </span>`;
  }).join('') + `<span class="cnt">총 ${mix.length}개</span>`;

  chipsEl.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', ev => {
      const n = +c.dataset.n;
      const act = ev.target.dataset.act;
      if(act === 'plus'){ addToMix(n); return; }
      // − 또는 칩 몸통 → 하나 빼기
      const i = mix.lastIndexOf(n);
      if(i >= 0) mix.splice(i, 1);
      renderChips();
    });
  });

  mixBtn.disabled = mix.length < 2;
}

function addToMix(n){
  if(mix.length >= MIX_MAX) return;
  mix.push(n);
  if(typeof SFX !== 'undefined') SFX.pick();
  renderChips();
}

clearBtn.addEventListener('click', () => { mix = []; renderChips(); });

function exactKey(arr){
  const cnt = {};
  arr.forEach(n => { const s = byNum[n].s; cnt[s] = (cnt[s]||0) + 1; });
  return Object.keys(cnt).sort().map(s => s + cnt[s]).join('+');
}

mixBtn.addEventListener('click', () => {
  const setKey = [...new Set(mix.map(n => byNum[n].s))].sort().join('+');
  const exKey  = exactKey(mix);

  let r = EXACT[exKey];
  let loose = false;
  if(!r){
    r = RECIPES[setKey];
    loose = !!(r && r[0]);   // 원소는 맞는데 개수가 안 맞은 경우
  }
  if(!r){
    // 같은 원소만 잔뜩 넣은 경우
    const uniq = [...new Set(mix.map(n => byNum[n].s))];
    if(uniq.length === 1){
      r = singleResult(uniq[0], mix.length);
      loose = false;
    }
  }

  (() => {
    const order = [], c = {};
    mix.forEach(n => { if(c[n] === undefined){ order.push(n); c[n] = 0; } c[n]++; });
    document.getElementById('mEq').textContent =
      order.map(n => c[n] > 1 ? `${byNum[n].s}×${c[n]}` : byNum[n].s).join('  +  ');
  })();

  const rl = locRec(r);
  // found.add 는 아래에서 일어나므로 여기서는 아직 '처음인지' 알 수 있다
  const wasNew = !!(r && r[1] && r[1] !== '미지의 물질' && !found.has(r[1]));
  if(rl && rl[0]){
    document.getElementById('mFormula').innerHTML = fmtFormula(rl[0]);
    document.getElementById('mFormula').className = 'formula';
    document.getElementById('mName').innerHTML =
      `<span class="badge">${loose ? t('loose') : t('ok')}</span><br>${rl[1]}`;
    document.getElementById('mSub').textContent = rl[2];
  } else {
    const FL = (LANG === 'en') ? FAIL_EN : FAIL;
    document.getElementById('mFormula').textContent = '???';
    document.getElementById('mFormula').className = 'formula fail';
    document.getElementById('mName').innerHTML =
      `<span class="badge">${t('failBadge')}</span><br>${t('unknown')}`;
    document.getElementById('mSub').textContent = FL[Math.floor(Math.random()*FL.length)];
  }
  mixExtra(r, wasNew);
  const BOOMS = ['트라이나이트로톨루엔','나이트로글리세린'];
  const boom = !!(r && r[1] && (r[1].includes('폭발') || BOOMS.includes(r[1])));
  const gem  = !!(r && r[1] && GEMS.includes(r[1]));

  // 도감 등록
  if(r && r[1] && r[1] !== '미지의 물질'){ found.add(r[1]); saveFound(); }

  SFX.start();
  playFusion(mix.slice(), !!(r && r[0]), () => {
    if(boom){
      SFX.boom(typeof boomScale === 'function' ? boomScale(r && r[1]) : 1);
      const tw = document.getElementById('tableWrap');
      tw.classList.remove('quaking'); void tw.offsetWidth; tw.classList.add('quaking');
    }
    else if(gem) SFX.gem();
    else if(r && r[0]) SFX.ok();
    else SFX.fail();
    modal.classList.add('on');
  }, boom, gem);
});

const fuseEl = document.getElementById('fuse');
const fcv = document.getElementById('fuseCv');
const fctx = fcv.getContext('2d');

let fuseItems = [], fuseStart = 0, fuseOk = false, fuseCb = null, fuseOn = false, fuseBoom = false, fuseGem = false;
let sparks = [];

const IN_DUR = 950;     // 빨려들어가는 시간
const OUT_DUR = 650;    // 터지고 나서

function fitFuse(){
  const dpr = Math.min(devicePixelRatio, 2);
  fcv.width = innerWidth * dpr;
  fcv.height = innerHeight * dpr;
  fctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', () => { if(fuseOn) fitFuse(); });

function playFusion(nums, ok, cb, boom, gem){
  fitFuse();
  const R = Math.min(innerWidth, innerHeight) * 0.32;
  fuseItems = nums.map((n, i) => {
    const e = byNum[n];
    return {
      sym: e.s,
      col: cssv(CAT[e.c].v),
      a0: (i / nums.length) * Math.PI * 2 - Math.PI/2,
      r0: R * (0.85 + Math.random() * 0.3),
      spin: 3 + Math.random() * 2,
    };
  });
  sparks = [];
  fuseOk = ok; fuseCb = cb; fuseOn = true; fuseBoom = !!boom; fuseGem = !!gem;
  fuseStart = performance.now();
  fuseEl.classList.add('on');
  requestAnimationFrame(fuseLoop);
}

const easeInCubic = t => t*t*t;
const easeOutCubic = t => 1 - Math.pow(1-t, 3);

function fuseLoop(now){
  if(!fuseOn) return;
  const el = now - fuseStart;
  const w = innerWidth, h = innerHeight;
  const cx = w/2, cy = h/2;
  fctx.clearRect(0,0,w,h);

  if(el < IN_DUR){
    // ── 빨려들어감 ──
    const t = el / IN_DUR;
    const k = easeInCubic(t);

    // 중심 코어가 점점 커짐
    const coreR = 4 + k * 26;
    const g = fctx.createRadialGradient(cx,cy,0,cx,cy,coreR*3.2);
    g.addColorStop(0, `rgba(255,255,255,${0.18 + k*0.75})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(cx,cy,coreR*3.2,0,Math.PI*2); fctx.fill();

    fuseItems.forEach(it => {
      const r = it.r0 * (1 - k);
      const a = it.a0 + k * it.spin;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;

      // 꼬리
      for(let q=1; q<=6; q++){
        const kk = Math.max(0, k - q*0.022);
        const rr = it.r0 * (1 - kk);
        const aa = it.a0 + kk * it.spin;
        fctx.beginPath();
        fctx.arc(cx + Math.cos(aa)*rr, cy + Math.sin(aa)*rr, 15 - q*1.8, 0, Math.PI*2);
        fctx.fillStyle = it.col;
        fctx.globalAlpha = 0.10 * (1 - q/7);
        fctx.fill();
      }
      fctx.globalAlpha = 1;

      // 본체
      const rad = 20 * (1 - k*0.45);
      const gg = fctx.createRadialGradient(x,y,0,x,y,rad*2);
      gg.addColorStop(0, it.col);
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      fctx.fillStyle = gg; fctx.globalAlpha = 0.55;
      fctx.beginPath(); fctx.arc(x,y,rad*2,0,Math.PI*2); fctx.fill();
      fctx.globalAlpha = 1;

      fctx.beginPath(); fctx.arc(x,y,rad,0,Math.PI*2);
      fctx.fillStyle = '#0b0d11'; fctx.fill();
      fctx.lineWidth = 2; fctx.strokeStyle = it.col; fctx.stroke();

      fctx.font = `700 ${Math.round(rad*0.95)}px Orbit, system-ui, sans-serif`;
      fctx.fillStyle = it.col;
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      fctx.fillText(it.sym, x, y);
    });

    requestAnimationFrame(fuseLoop);
    return;
  }

  // ── 터짐 ──
  const t2 = (el - IN_DUR) / OUT_DUR;

  if(sparks.length === 0){
    const N = fuseBoom ? 160 : (fuseGem ? 90 : (fuseOk ? 46 : 18));
    const BOOMC = ['#ffd43b','#ff922b','#ff6b6b','#fff3bf'];
    for(let i=0;i<N;i++){
      const a = Math.random() * Math.PI * 2;
      const sp = (fuseBoom ? 15 : (fuseOk ? 6 : 2.2)) * (0.4 + Math.random());
      sparks.push({
        x:cx, y:cy,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        col: fuseGem ? `hsl(${(i*29)%360} 90% 65%)`
           : (fuseBoom ? BOOMC[i % BOOMC.length]
           : (fuseOk ? fuseItems[i % fuseItems.length].col : '#6b7280')),
        r: (fuseBoom ? 2.5 : 2) + Math.random()*3,
      });
    }
  }

  // 충격파 링
  if(fuseOk){
    const rings = fuseBoom ? 3 : (fuseGem ? 4 : 1);
    for(let q=0;q<rings;q++){
      const tt = Math.max(0, Math.min(1, t2 - q*0.12));
      const rr = easeOutCubic(tt) * Math.min(w,h) * (fuseBoom ? 0.75 : 0.42);
      fctx.beginPath(); fctx.arc(cx,cy,rr,0,Math.PI*2);
      fctx.strokeStyle = fuseBoom
        ? `rgba(255,180,80,${Math.max(0,0.8 - tt)})`
        : (fuseGem
          ? `hsla(${(tt*360)|0} 95% 70% / ${Math.max(0,0.85 - tt)})`
          : `rgba(255,255,255,${Math.max(0,0.75 - tt)})`);
      fctx.lineWidth = (fuseBoom ? 5 : 3) * (1 - tt);
      fctx.stroke();
    }
  }

  // 섬광
  const fl = Math.max(0, 1 - t2*2.4);
  if(fl > 0){
    const g = fctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*(fuseBoom?0.8:0.45));
    g.addColorStop(0, `rgba(255,255,255,${fl})`);
    if(fuseBoom) g.addColorStop(0.35, `rgba(255,180,70,${fl*0.7})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = g;
    fctx.fillRect(0,0,w,h);
  }

  // 파편
  sparks.forEach(s2 => {
    s2.x += s2.vx; s2.y += s2.vy;
    s2.vy += fuseOk ? 0.05 : 0.14;
    s2.vx *= 0.985; s2.vy *= 0.985;
    fctx.globalAlpha = Math.max(0, 1 - t2);
    fctx.beginPath(); fctx.arc(s2.x, s2.y, s2.r, 0, Math.PI*2);
    fctx.fillStyle = s2.col; fctx.fill();
  });
  fctx.globalAlpha = 1;

  if(t2 >= 1){
    fuseOn = false;
    fuseEl.classList.remove('on');
    fctx.clearRect(0,0,w,h);
    if(fuseCb) fuseCb();
    return;
  }
  requestAnimationFrame(fuseLoop);
}

/* ═══════════ 소리 (Web Audio) ═══════════ */
let sndOn = true;
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay){
  if(!sndOn) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime + (delay||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol||0.12, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sweep(f1, f2, dur, vol){
  if(!sndOn) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol||0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol){
  if(!sndOn) return;
  const a = ac(); if(!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 900;
  const g = a.createGain(); g.gain.value = vol||0.3;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}
const SFX = {
  pick(){ tone(660, 0.07, 'square', 0.05); },
  start(){ sweep(180, 900, 0.9, 0.05); },
  ok(){ [523,659,784].forEach((f,i)=>tone(f,0.5,'triangle',0.1,i*0.06)); },
  gem(){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,0.6,'sine',0.08,i*0.055)); },
  boom(){ noiseBurst(0.7,0.4); tone(60,0.7,'sine',0.3); tone(42,0.9,'sine',0.25,0.04); },
  fail(){ tone(300,0.16,'sawtooth',0.07); tone(200,0.24,'sawtooth',0.07,0.13); },
};

function allEntries(){
  const out = [];
  const seen = new Set();
  const push = (key, arr, exact) => {
    if(!arr || !arr[0] || arr[0] === '-') { if(!arr || !arr[1]) return; }
    const nm = arr[1];
    if(seen.has(nm)) return;
    seen.add(nm);
    out.push({ name: nm, formula: arr[0], sub: arr[2], key, exact });
  };
  Object.entries(EXACT).forEach(([k,v]) => push(k, v, true));
  Object.entries(RECIPES).forEach(([k,v]) => push(k, v, false));
  return out.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
}

  const list = allEntries();
  const got = list.filter(x => found.has(x.name)).length;
  document.getElementById('dexCnt').textContent = `${got} / ${list.length}`;
  document.getElementById('dexList').innerHTML = list.map(x => {
    if(found.has(x.name)){
      return `<div class="dx">
        <div class="f">${fmtFormula(x.formula)}</div>
        <div class="n">${x.name}</div>
        <div class="s">${x.sub || ''}</div>
      </div>`;
    }
    const hint = x.key.replace(/\d+/g, m => '×'+m).split('+').join(' + ');
    return `<div class="dx locked">
      <div class="f">???</div>
      <div class="n">? ? ?</div>
      <div class="hint">${hint}</div>
    </div>`;
  }).join('');
  dexEl.classList.add('on');
}

/* ── 해석 함수 ── */
function subOf(e){
  if(LANG === 'en') return SUB_EN[e.s] || SUB_FB_EN[e.c] || "";
  if(SAFE && SAFE_SUB[e.s]) return SAFE_SUB[e.s];
  return SUB[e.s] || SUB_FALLBACK[e.c] || "설명 준비 중";
}
function sub2Of(e){
  if(LANG === 'en') return SUB2_EN[e.s] || "";
  if(SAFE && SAFE_SUB2[e.s]) return SAFE_SUB2[e.s];
  return SUB2[e.s] || "";
}
function sub3Of(e){
  if(LANG === 'en') return SUB3_EN[e.s] || "";
  if(SAFE && SAFE_SUB3[e.s]) return SAFE_SUB3[e.s];
  return SUB3[e.s] || "";
}
/* r = [formula, name, desc] → 언어/모드 적용된 [formula, name, desc] */
function locRec(r){
  if(!r) return r;
  if(LANG === 'en'){
    const x = REC_EN[r[1]];
    return x ? [r[0], x[0], x[1]] : [r[0], r[1], r[2]];
  }
  if(SAFE){
    const x = SAFE_REC[r[1]];
    if(x) return [r[0], x[0] || r[1], x[1]];
  }
  return r;
}

/* ═══════════════════════════════════════════════════
   보기 모드: 표준 / 히트맵 / 온도
   ═══════════════════════════════════════════════════ */
let VIEW = 'none';        // none | heat | temp
let HEATP = 'en';         // 히트맵에 쓸 물성
let TEMPK = 298;          // 현재 온도 (K)

const PROP_DEFS = [
  { k:'en', ko:'전기음성도',    en:'Electronegativity', unit:'',        scale:'lin' },
  { k:'ie', ko:'이온화 에너지', en:'Ionization energy', unit:'kJ/mol',  scale:'lin' },
  { k:'r',  ko:'원자 반지름',   en:'Atomic radius',     unit:'pm',      scale:'lin' },
  { k:'mp', ko:'녹는점',        en:'Melting point',     unit:'°C',      scale:'lin' },
  { k:'bp', ko:'끓는점',        en:'Boiling point',     unit:'°C',      scale:'lin' },
  { k:'d',  ko:'밀도',          en:'Density',           unit:'g/cm³',   scale:'log' },
  { k:'yr', ko:'발견 연도',     en:'Year discovered',   unit:'',        scale:'lin' },
  { k:'mastery', ko:'내 숙련도', en:'My mastery',        unit:'%',       scale:'special' },
  { k:'flame',   ko:'불꽃 반응',  en:'Flame test',        unit:'',        scale:'special' },
];
const propDef = k => PROP_DEFS.find(p => p.k === k);
const propLabel = p => LANG === 'en' ? p.en : p.ko;

/* 히트맵에 쓸 스케일용 원시값 */
function rawVal(e, k){
  const p = PROPS[e.s];
  if(!p) return null;
  let v = p[k];
  if(v === null || v === undefined) return null;
  if(k === 'yr' && v === 0) v = 1600;             // 고대 → 스케일 하한
  if(k === 'mp' || k === 'bp') v = v - 273.15;    // K → ℃
  return v;
}
/* 화면에 보여줄 짧은 값 */
function shortVal(e, k){
  const p = PROPS[e.s];
  if(!p || p[k] === null || p[k] === undefined) return '—';
  if(k === 'yr') return p.yr === 0 ? (LANG === 'en' ? 'anc.' : '고대') : String(p.yr);
  if(k === 'd')  return p.d < 0.01 ? p.d.toPrecision(2) : (p.d < 10 ? p.d.toFixed(1) : Math.round(p.d));
  if(k === 'en') return p.en.toFixed(2);
  if(k === 'mp' || k === 'bp') return String(Math.round(p[k] - 273.15));
  return String(Math.round(p[k]));
}

const heatRange = {};
PROP_DEFS.forEach(p => {
  if(p.scale === 'special') return;
  const vs = EL.map(e => rawVal(e, p.k)).filter(v => v !== null);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(p.scale === 'log'){ lo = Math.log10(lo); hi = Math.log10(hi); }
  heatRange[p.k] = [lo, hi];
});

const RAMP = [[27,42,74],[31,111,139],[47,163,124],[232,196,104],[226,96,63]];
function rampColor(f){
  f = Math.max(0, Math.min(1, f));
  const x = f * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(x));
  const w = x - i, a = RAMP[i], b = RAMP[i+1];
  return [0,1,2].map(j => Math.round(a[j] + (b[j] - a[j]) * w));
}
const rgbCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const readable = c => (c[0]*0.299 + c[1]*0.587 + c[2]*0.114) > 150 ? '#10141b' : '#eef2f7';

/* 학습 기록. paint 한 번에 한 번만 읽는다 */
let STAT_CACHE = {};
function refreshStat(){ STAT_CACHE = (typeof loadStat === 'function') ? loadStat() : {}; }

const MRAMP = [[201,72,72],[224,140,66],[226,196,84],[120,190,110],[92,198,128]];
function masteryColor(f){
  f = Math.max(0, Math.min(1, f));
  const x = f * (MRAMP.length - 1);
  const i = Math.min(MRAMP.length - 2, Math.floor(x));
  const w = x - i, a = MRAMP[i], b = MRAMP[i+1];
  return [0,1,2].map(j => Math.round(a[j] + (b[j] - a[j]) * w));
}
function masteryOf(e){
  const v = STAT_CACHE[e.s];
  if(!v) return null;
  const tries = v[0] + v[1];
  return tries ? { acc: v[0] / tries, tries } : null;
}

function heatFrac(e){
  const v = rawVal(e, HEATP);
  if(v === null) return null;
  const d = propDef(HEATP);
  let [lo, hi] = heatRange[HEATP];
  const x = d.scale === 'log' ? Math.log10(v) : v;
  return hi === lo ? 0.5 : (x - lo) / (hi - lo);
}

/* ── 온도에 따른 상태 ── */
function stateAt(e, T){
  const p = PROPS[e.s];
  if(!p) return null;
  if(p.bp !== null && T >= p.bp) return 'gas';
  if(p.mp !== null && T >= p.mp) return 'liquid';
  if(p.mp === null && p.bp !== null) return 'liquid';   // 헬륨: 1기압에선 응고하지 않음
  if(p.mp === null) return null;
  return 'solid';
}
const STATE_COL = { solid:[57,65,79], liquid:[30,106,148], gas:[160,74,60] };
const stateLabel = s => LANG === 'en'
  ? ({solid:'S', liquid:'L', gas:'G'})[s]
  : ({solid:'고', liquid:'액', gas:'기'})[s];
const stateFull = s => LANG === 'en'
  ? ({solid:'Solid', liquid:'Liquid', gas:'Gas'})[s]
  : ({solid:'고체', liquid:'액체', gas:'기체'})[s];

/* ═══ 표 칠하기 (원본 paint 대체) ═══ */
function paint(){
  document.querySelectorAll('.ghead').forEach(h =>
    h.classList.toggle('on', hlGroup !== null && +h.dataset.g === hlGroup));
  document.querySelectorAll('.phead').forEach(h =>
    h.classList.toggle('on', hlPeriod !== null && +h.dataset.p === hlPeriod));

  if(VIEW === 'heat' && HEATP === 'mastery') refreshStat();
  document.body.classList.toggle('mode-heat', VIEW === 'heat');
  document.body.classList.toggle('mode-temp', VIEW === 'temp');

  const tally = { solid:0, liquid:0, gas:0, none:0 };

  document.querySelectorAll('.cell').forEach(c => {
    const e = byNum[+c.dataset.n];
    let dim = false, hl = false;

    if(catFilter.size && !catFilter.has(e.c)) dim = true;
    if(query && !matchQuery(e)) dim = true;
    c.classList.toggle('tox', toxOn && isToxic(e));
    if(hlGroup !== null){ if(e.g === hlGroup) hl = true; else dim = true; }
    if(hlPeriod !== null){ if(e.p === hlPeriod) hl = true; else dim = true; }

    c.classList.toggle('dim', dim);
    c.classList.toggle('hl', hl && !dim);
    c.classList.toggle('sel', selected === e.n);

    const st = c.querySelector('.st');
    if(VIEW === 'heat' && HEATP === 'flame'){
      const f = (typeof flameOf === 'function') ? flameOf(e) : null;
      if(!f){
        c.style.background = '#232a36'; c.style.color = '#5f6a7a';
        if(st) st.textContent = '—';
      } else {
        c.style.background = f[0];
        c.style.color = readable(hex2rgb(f[0]));
        if(st) st.textContent = f[LANG === 'en' ? 2 : 1];
      }
    } else if(VIEW === 'heat' && HEATP === 'mastery'){
      const m = masteryOf(e);
      if(!m){
        c.style.background = '#232a36'; c.style.color = '#5f6a7a';
        if(st) st.textContent = '—';
      } else {
        const col = masteryColor(m.acc);
        c.style.background = rgbCss(col); c.style.color = readable(col);
        if(st) st.textContent = Math.round(m.acc * 100) + '%';
      }
    } else if(VIEW === 'heat'){
      const f = heatFrac(e);
      if(f === null){
        c.style.background = '#232a36'; c.style.color = '#5f6a7a';
      } else {
        const col = rampColor(f);
        c.style.background = rgbCss(col); c.style.color = readable(col);
      }
      if(st) st.textContent = shortVal(e, HEATP);
    } else if(VIEW === 'temp'){
      const s = stateAt(e, TEMPK);
      tally[s || 'none']++;
      if(!s){
        c.style.background = '#232a36'; c.style.color = '#5f6a7a';
        if(st) st.textContent = '?';
      } else {
        const col = STATE_COL[s];
        c.style.background = rgbCss(col); c.style.color = readable(col);
        if(st) st.textContent = stateLabel(s);
      }
    } else {
      c.style.background = ''; c.style.color = '';
      if(st) st.textContent = '';
    }
  });

  if(VIEW === 'temp'){
    const el = document.getElementById('tTally');
    if(el) el.textContent =
      `${stateFull('solid')} ${tally.solid} · ${stateFull('liquid')} ${tally.liquid} · ${stateFull('gas')} ${tally.gas} · ${LANG==='en'?'no data':'자료 없음'} ${tally.none}`;
  }
}

/* ═══ 상세 패널의 물성 표 ═══ */
function propRowsHTML(e){
  const p = PROPS[e.s];
  if(!p) return '';
  const row = (label, val) => val === null || val === undefined || val === ''
    ? '' : `<div class="r"><span>${label}</span><span>${val}</span></div>`;

  const blk = (e.c === 'lanthanide' || e.c === 'actinide') ? 'f'
            : (e.g === 1 || e.g === 2) ? 's'
            : (e.g >= 13) ? 'p' : 'd';

  // 최외각 전자는 족에서 바로 나온다 (전이·내부전이 원소는 규칙이 복잡해 생략)
  const VAL = {1:1, 2:2, 13:3, 14:4, 15:5, 16:6, 17:7, 18:8};
  const val = (e.s === 'He') ? 2 : (VAL[e.g] ?? null);
  // 주로 만드는 이온
  const COMMON_ION = {1:'+1', 2:'+2', 13:'+3', 15:'-3', 16:'-2', 17:'-1'};
  const ion = (e.c === 'noble') ? null : (COMMON_ION[e.g] ?? null);
  const ionTxt = ion ? `${e.s}<sup>${ion.replace('+1','+').replace('-1','−')}</sup> (${ion.replace('-','−')})` : null;
  const L = LANG === 'en';
  // 원본 데이터가 켈빈 정수라 ℃도 정수로만 표기 (없는 정밀도를 만들지 않음)
  const temp = k => p[k] === null ? null
    : `${Math.round(p[k] - 273.15)} °C <em>(${p[k]} K)</em>`;
  const yr = p.yr === null ? null : (p.yr === 0 ? (L ? 'Ancient' : '고대') : p.yr);

  return `
    <div class="shellTitle">${L ? 'Properties' : '물성'}</div>
    <div class="rows props">
      ${row(L?'Configuration':'전자 배치', p.cfg)}
      ${row(L?'Block':'오비탈 블록', `${blk}${L ? '-block' : ' 블록'}`)}
      ${row(L?'Valence electrons':'최외각 전자', val)}
      ${row(L?'Common ion':'주로 만드는 이온', ionTxt)}
      ${row(L?'Oxidation states':'산화수', p.ox)}
      ${row(L?'Electronegativity':'전기음성도', p.en)}
      ${row(L?'Ionization energy':'이온화 에너지', p.ie === null ? null : `${p.ie} kJ/mol`)}
      ${row(L?'Atomic radius':'원자 반지름', p.r === null ? null : `${p.r} pm`)}
      ${row(L?'Melting point':'녹는점', temp('mp'))}
      ${row(L?'Boiling point':'끓는점', temp('bp'))}
      ${row(L?'Density':'밀도', p.d === null ? null : `${p.d < 0.01 ? p.d.toPrecision(3) : p.d} g/cm³`)}
      ${row(L?'State at 25°C':'상온 상태', p.st ? stateFull(p.st) : null)}
      ${row(L?'Discovered':'발견 연도', yr)}
    </div>`;
}

/* ═══ 모드 바 ═══ */
const modeOpt = document.getElementById('mopt');

function renderModeBar(){
  const tabs = [['none','vStd'],['heat','vHeat'],['temp','vTemp']];
  document.getElementById('mtabs').innerHTML = tabs.map(([k,l]) =>
    `<button class="mbtn${VIEW===k?' on':''}" data-m="${k}">${t(l)}</button>`).join('');
  document.querySelectorAll('#mtabs .mbtn').forEach(b =>
    b.addEventListener('click', () => { VIEW = b.dataset.m; renderModeBar(); paint(); }));

  if(VIEW === 'heat' && HEATP === 'flame'){
    const n = EL.filter(e => flameOf(e)).length;
    modeOpt.innerHTML = `
      <div class="mchips">${PROP_DEFS.map(p =>
        `<button class="mchip${HEATP===p.k?' on':''}" data-p="${p.k}">${propLabel(p)}</button>`).join('')}</div>
      <div class="mlegend"><span class="lu">${t('flameNote').replace('{n}', n)}</span></div>`;
    modeOpt.querySelectorAll('.mchip').forEach(b =>
      b.addEventListener('click', () => { HEATP = b.dataset.p; renderModeBar(); paint(); }));

  } else if(VIEW === 'heat' && HEATP === 'mastery'){
    refreshStat();
    const seen = EL.filter(e => masteryOf(e)).length;
    const stops = [0,.25,.5,.75,1].map(f => rgbCss(masteryColor(f))).join(',');
    modeOpt.innerHTML = `
      <div class="mchips">${PROP_DEFS.map(p =>
        `<button class="mchip${HEATP===p.k?' on':''}" data-p="${p.k}">${propLabel(p)}</button>`).join('')}</div>
      <div class="mlegend">
        <span class="lv">0%</span>
        <span class="bar" style="background:linear-gradient(90deg,${stops})"></span>
        <span class="lv">100%</span>
        <span class="lu">${seen ? t('mastSeen').replace('{n}', seen) : t('mastNone')}</span>
      </div>`;
    modeOpt.querySelectorAll('.mchip').forEach(b =>
      b.addEventListener('click', () => { HEATP = b.dataset.p; renderModeBar(); paint(); }));

  } else if(VIEW === 'heat'){
    const d = propDef(HEATP);
    let [lo, hi] = heatRange[HEATP];
    if(d.scale === 'log'){ lo = Math.pow(10, lo); hi = Math.pow(10, hi); }
    const fmt = v => d.scale === 'log'
      ? (v < 0.01 ? v.toPrecision(2) : (v < 10 ? v.toFixed(1) : Math.round(v)))
      : (Math.abs(v) < 10 ? v.toFixed(2) : Math.round(v));
    const stops = [0,.25,.5,.75,1].map(f => rgbCss(rampColor(f))).join(',');
    modeOpt.innerHTML = `
      <div class="mchips">${PROP_DEFS.map(p =>
        `<button class="mchip${HEATP===p.k?' on':''}" data-p="${p.k}">${propLabel(p)}</button>`).join('')}</div>
      <div class="mlegend">
        <span class="lv">${fmt(lo)}</span>
        <span class="bar" style="background:linear-gradient(90deg,${stops})"></span>
        <span class="lv">${fmt(hi)}</span>
        <span class="lu">${d.unit}</span>
        ${d.scale === 'log' ? `<span class="lu">${LANG==='en'?'log scale':'로그 눈금'}</span>` : ''}
      </div>`;
    modeOpt.querySelectorAll('.mchip').forEach(b =>
      b.addEventListener('click', () => { HEATP = b.dataset.p; renderModeBar(); paint(); }));

  } else if(VIEW === 'temp'){
    const presets = LANG === 'en'
      ? [[273,'0°C'],[298,'Room'],[373,'100°C'],[1273,'1000°C'],[1811,'Iron melts'],[5778,'Sun surface']]
      : [[273,'0℃'],[298,'상온'],[373,'100℃'],[1273,'1000℃'],[1811,'철 녹는점'],[5778,'태양 표면']];
    modeOpt.innerHTML = `
      <div class="trow">
        <input type="range" id="tSlider" min="0" max="6000" step="1" value="${TEMPK}">
        <span class="treadout" id="tRead"></span>
      </div>
      <div class="mchips">${presets.map(([k,l]) =>
        `<button class="mchip" data-t="${k}">${l}</button>`).join('')}</div>
      <div class="ttally" id="tTally"></div>`;
    const sl = document.getElementById('tSlider');
    const upd = () => {
      TEMPK = +sl.value;
      document.getElementById('tRead').innerHTML =
        `<b>${TEMPK} K</b> <em>${(TEMPK-273.15).toFixed(0)} ${LANG==='en'?'°C':'℃'}</em>`;
      paint();
    };
    sl.addEventListener('input', upd);
    modeOpt.querySelectorAll('.mchip').forEach(b =>
      b.addEventListener('click', () => { sl.value = b.dataset.t; upd(); }));

  } else {
    modeOpt.innerHTML = '';
  }

function daySeed(){
  const d = new Date();
  const s = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h;
}

function todayKey(){
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayHoliday(){ return HOLIDAY[todayKey()] || null; }

function todayElement(){
  const s = daySeed();
  const L = LANG === 'en' ? 'en' : 'ko';
  const h = todayHoliday();
  if(h && h.sym){
    const e = EL.find(x => x.s === h.sym);
    if(e) return { el:e, fortune:h[L][1], holiday:h[L][0], solemn:!!h.solemn };
  }
  return {
    el: EL[s % EL.length],
    fortune: FORTUNE[L][(s >>> 9) % FORTUNE.ko.length],
  };
}

function ptStart(){
  PTEST.i = 0; PTEST.done = false; PTEST.result = null;
  PTEST.score = {};
  PT_RESULTS.forEach(s => PTEST.score[s] = 0);
  ptRender();
}

function ptRender(){
  setFocus(true);
  const L = LANG === 'en' ? 'en' : 'ko';
  const qs = PT_Q[L];

  if(PTEST.i >= qs.length){ ptResult(); return; }
  const [prompt, a, b] = qs[PTEST.i];

  qHeadEl.innerHTML = `<h2>${t('ptTitle')}</h2>
    <span class="qprog">${PTEST.i + 1} / ${qs.length}</span>
    <span class="x" id="qClose">×</span>`;
  bindQClose();

  qBodyEl.innerHTML = `
    <div class="ptbar"><i style="width:${PTEST.i / qs.length * 100}%"></i></div>
    <div class="qprompt">${prompt}</div>
    <div class="qopts">
      <button class="qopt" data-i="0">${a[0]}</button>
      <button class="qopt" data-i="1">${b[0]}</button>
    </div>`;

  qBodyEl.querySelectorAll('.qopt').forEach(btn => btn.addEventListener('click', () => {
    const pick = btn.dataset.i === '0' ? a : b;
    pick[1].forEach(s => { if(PTEST.score[s] !== undefined) PTEST.score[s]++; });
    PTEST.i++;
    SFX.pick();
    ptRender();
  }));
}

function ptResult(){
  const L = LANG === 'en' ? 'en' : 'ko';
  const top = Math.max(...Object.values(PTEST.score));
  const winners = PT_RESULTS.filter(s => PTEST.score[s] === top);
  const sym = winners[(daySeed() + PTEST.i) % winners.length];
  const e = EL.find(x => x.s === sym);
  const col = cssv(CAT[e.c].v);
  const [title, desc] = PT_DESC[L][sym];
  const mate = EL.find(x => x.s === PT_MATCH[sym]);
  PTEST.result = sym;
  SFX.gem();

  qHeadEl.innerHTML = `<h2>${t('ptTitle')}</h2><span class="x" id="qClose">×</span>`;
  bindQClose();

  qBodyEl.innerHTML = `

  d.addEventListener('click', () => {

    if(MEM.on && MEM.mode === 'fill' && d.classList.contains('blank')){ fillPlace(e.n, d); return; }

      addToMix(e.n, ADD_QTY);

/* ── 검색 ── */
function matchQuery(e){
  if(!query) return true;
  return e.ko.includes(query)
      || e.en.toLowerCase().includes(query)
      || e.s.toLowerCase() === query
      || e.s.toLowerCase().startsWith(query)
      || String(e.n) === query;
}

/* ── 트레이 ── */
function renderChips(){
  if(!mix.length){
    chipsEl.innerHTML = `<span class="ph">${t('trayPh')}</span>`;
    mixBtn.disabled = true;
    return;
  }
  const order = [], cnt = {};
  mix.forEach(n => { if(cnt[n] === undefined){ order.push(n); cnt[n] = 0; } cnt[n]++; });

  chipsEl.innerHTML = order.map(n => {
    const e = byNum[n];
    return `<span class="chip" data-n="${n}" style="color:${cssv(CAT[e.c].v)}">
      <span class="mi" data-act="minus">−</span>
      ${e.s}<span class="n">×${cnt[n]}</span>
      <span class="pl" data-act="plus">＋</span>
    </span>`;
  }).join('') + `<span class="cnt">${t('total')} ${mix.length}</span>`;

  chipsEl.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', ev => {
      const n = +c.dataset.n;
      if(ev.target.dataset.act === 'plus'){ addToMix(n); return; }
      const i = mix.lastIndexOf(n);
      if(i >= 0) mix.splice(i, 1);
      renderChips();
    });
  });
  mixBtn.disabled = mix.length < 2;
}

/* ── 같은 원소만 넣었을 때 ── */
function singleResult(sym, cnt){
  const tb = SINGLE[sym];
  if(tb){ for(const [a,b,f,n,s] of tb){ if(cnt >= a && cnt <= b) return [f, n, s]; } }
  const e = EL.find(x => x.s === sym);
  const nm = e ? elName(e) : sym;
  return LANG === 'en'
    ? [sym, `Pile of ${nm.toLowerCase()}`, `${cnt} of them is still just ${nm.toLowerCase()}`]
    : [sym, `${nm} 덩어리`, `${cnt}개 모아봤자 그냥 ${nm}임`];
}

/* ── 도감 ── */
function openDex(){
  const list = allEntries().map(x => {
    const r = locRec([x.formula, x.name, x.sub]);
    return { key:x.key, koName:x.name, formula:r[0], name:r[1], sub:r[2], exact:x.exact };
  }).sort((a,b) => a.name.localeCompare(b.name, LANG === 'en' ? 'en' : 'ko'));

  const got = list.filter(x => found.has(x.koName)).length;
  document.getElementById('dexTitle').textContent = t('dexTitle');
  document.getElementById('dexCnt').textContent = `${got} / ${list.length}`;
  const ar = document.getElementById('achRow');
  if(ar) ar.innerHTML = (typeof achHTML === 'function') ? achHTML() : '';
  document.getElementById('dexList').innerHTML = list.map(x => {
    if(found.has(x.koName)){
      return `<div class="dx">
        <div class="f">${fmtFormula(x.formula)}</div>
        <div class="n">${x.name}</div>
        <div class="s">${x.sub || ''}</div>
      </div>`;
    }
    // 비율 무관 레시피는 개수가 안 붙어서, 이미 만든 정확 비율 조합과
    // 힌트가 똑같아 보인다. 그래서 따로 표시해 준다
    const hint = x.key.replace(/\d+/g, m => '×'+m).split('+').join(' + ');
    return `<div class="dx locked">
      <div class="f">???</div>
      <div class="n">? ? ?</div>
      <div class="hint">${hint}${x.exact ? '' : ` <em>${t('anyRatio')}</em>`}</div>
    </div>`;
  }).join('');
  dexEl.classList.add('on');
}

/* ═══════════════════════════════════════════════════
   퀴즈
   ═══════════════════════════════════════════════════ */
const QZ = {
  on:false, mode:'mixed', diff:'easy', len:10,
  i:0, score:0, streak:0, bestStreak:0, wrong:[], q:null, answered:false
};
const QMODES = ['sym2name','name2sym','num','cat','find','compare','cfg'];

/* 문제를 푸는 동안에는 뒤에 표가 비치면 안 된다.
   오버레이가 반투명이면 답이 그대로 보여서 퀴즈가 성립하지 않음.
   단, '표에서 찾기'와 '빈칸 채우기'는 표를 봐야 푸는 문제라 예외. */
function setFocus(on){
  document.body.classList.toggle('learn-focus', !!on);
}

const quizEl   = document.getElementById('quiz');
const qBodyEl  = document.getElementById('qBody');
const qHeadEl  = document.getElementById('qHead');
const qBarEl   = document.getElementById('qBar');

function bestKey(){ return `pt_qbest_${QZ.mode}_${QZ.diff}_${QZ.len}`; }
function getBest(){ try{ return +(localStorage.getItem(bestKey()) || 0); }catch(e){ return 0; } }
function setBest(v){ try{ localStorage.setItem(bestKey(), v); }catch(e){} }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function qPool(){
  const max = QZ.diff === 'easy' ? 20 : (QZ.diff === 'normal' ? 56 : 118);
  return EL.filter(e => e.n <= max);
}

function genQ(){
  const pool = qPool();
  const mode = QZ.mode === 'mixed' ? QMODES[(Math.random()*QMODES.length)|0] : QZ.mode;
  const e = pool[(Math.random()*pool.length)|0];
  const others = pool.filter(x => x.n !== e.n);

  if(mode === 'find') return { mode, e, prompt:`${elName(e)}  ·  ${e.s}` };

  let prompt = '', ans = '', opts = [];
  if(mode === 'sym2name'){
    prompt = e.s; ans = elName(e);
    opts = shuffle(others.slice()).slice(0,3).map(elName);
  } else if(mode === 'name2sym'){
    prompt = elName(e); ans = e.s;
    opts = shuffle(others.slice()).slice(0,3).map(x => x.s);
  } else if(mode === 'num'){
    prompt = `${elName(e)}  ·  ${e.s}`; ans = String(e.n);
    const near = new Set();
    while(near.size < 3){
      const d = e.n + ((Math.random()*13)|0) - 6;
      if(d >= 1 && d <= 118 && d !== e.n) near.add(String(d));
    }
    opts = [...near];
  } else if(mode === 'compare'){
    /* 주기성 비교. 값이 있는 원소 4개 중 최대/최소를 고른다 */
    // 크기를 가리키는 말이 물성마다 다르다 (energy is high/low, radius is large/small)
    const P = [
      ['en', 'cmpEn', 'cmpMax', 'cmpMin'],   // 전기음성도
      ['ie', 'cmpIe', 'cmpMax', 'cmpMin'],   // 이온화 에너지
      ['r',  'cmpR',  'cmpBig', 'cmpSmall'], // 원자 반지름
    ];
    const [key, label, hi, lo] = P[(Math.random()*P.length)|0];
    const big = Math.random() < 0.5;
    const cands = pool.filter(x => PROPS[x.s] && PROPS[x.s][key] !== null);
    if(cands.length < 4) return genQ();            // 표본이 모자라면 다시
    const four = shuffle(cands.slice()).slice(0, 4);
    const vals = four.map(x => PROPS[x.s][key]);
    const best = big ? Math.max(...vals) : Math.min(...vals);
    if(vals.filter(v => v === best).length > 1) return genQ();   // 동점이면 다시
    const win = four[vals.indexOf(best)];
    return {
      mode, e: win,
      prompt: t(label).replace('{d}', t(big ? hi : lo)),
      ans: elName(win),
      options: shuffle(four.map(elName)),
      big, key,
    };

  } else if(mode === 'cfg'){
    const cands = pool.filter(x => PROPS[x.s] && PROPS[x.s].cfg);
    if(cands.length < 4) return genQ();
    const e2 = cands[(Math.random()*cands.length)|0];
    const others2 = cands.filter(x => x.n !== e2.n);
    return {
      mode, e: e2,
      prompt: PROPS[e2.s].cfg,
      ans: elName(e2),
      options: shuffle([elName(e2), ...shuffle(others2.slice()).slice(0,3).map(elName)]),
    };

  } else { /* cat */
    prompt = `${elName(e)}  ·  ${e.s}`; ans = catName(e.c);
    const cats = [...new Set(EL.map(x => x.c))].filter(c => c !== e.c);
    opts = shuffle(cats).slice(0,3).map(catName);
  }
  return { mode, e, prompt, ans, options: shuffle([ans, ...opts]) };
}

function qStartRun(){
  QZ.on = true; QZ.i = 0; QZ.score = 0; QZ.streak = 0; QZ.bestStreak = 0; QZ.wrong = [];
  query = ''; catFilter.clear(); hlGroup = null; hlPeriod = null;
  const se = document.getElementById('search'); if(se) se.value = '';
  document.querySelectorAll('.lg').forEach(b => b.setAttribute('aria-pressed','false'));
  paint();
  nextQ();
}

function nextQ(){
  if(QZ.i >= QZ.len){ qShowResult(); return; }
  QZ.q = genQ();
  QZ.answered = false;
  QZ.i++;
  renderQ();
}

function qHeadHTML(){
  return `<h2>${t('qTitle')}</h2>
    <span class="qprog">${QZ.i} / ${QZ.len}</span>
    <span class="qsc">${t('qScore')} <b>${QZ.score}</b></span>
    <span class="qst">${t('qStreak')} <b>${QZ.streak}</b></span>
    <span class="x" id="qClose">×</span>`;
}
function bindQClose(){
  const x = document.getElementById('qClose');
  if(x) x.addEventListener('click', qEnd);
}

function renderQ(){
  const q = QZ.q;
  setFocus(q.mode !== 'find');     // 표에서 찾기는 표가 보여야 함
  if(q.mode === 'find'){
    quizEl.classList.remove('on');
    qBarEl.classList.add('on');
    qBarEl.innerHTML = `
      <span class="qbq">${t('qQ_find')}: <b>${q.prompt}</b></span>
      <span class="qbmeta">${QZ.i}/${QZ.len} · ${t('qScore')} ${QZ.score}</span>
      <button class="tbtn" id="qBarQuit">${t('qQuit')}</button>`;
    document.getElementById('qBarQuit').addEventListener('click', qEnd);
    return;
  }
  qBarEl.classList.remove('on');
  quizEl.classList.add('on');
  qHeadEl.innerHTML = qHeadHTML(); bindQClose();

  const label = { sym2name:'qQ_sym2name', name2sym:'qQ_name2sym', num:'qQ_num',
                  cat:'qQ_cat', compare:null, cfg:'qQ_cfg' }[q.mode];
  const head = (q.mode === 'compare') ? q.prompt : t(label);
  const big = (q.mode === 'sym2name' || q.mode === 'cfg');
  qBodyEl.innerHTML = `
    <div class="qlabel">${head}</div>
    ${q.mode === 'compare' ? '' :
      `<div class="qprompt ${big ? 'big' : ''}">${q.prompt}</div>`}
    <div class="qopts">${q.options.map((o,i)=>
      `<button class="qopt" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="qfeed" id="qFeed"></div>`;

  qBodyEl.querySelectorAll('.qopt').forEach(b => {
    b.addEventListener('click', () => answerChoice(b.textContent, b));
  });
}

function markScore(ok, q){
  if(q && q.e) (ok ? noteHit : noteMiss)(q.e.s);
  if(ok){
    QZ.score++; QZ.streak++;
    if(QZ.streak > QZ.bestStreak) QZ.bestStreak = QZ.streak;
    SFX.ok();
  } else {
    QZ.streak = 0;
    QZ.wrong.push(q);
    SFX.fail();
  }
}

function answerChoice(picked, btn){
  if(QZ.answered) return;
  QZ.answered = true;
  const q = QZ.q;
  const ok = picked === q.ans;
  markScore(ok, q);

  qBodyEl.querySelectorAll('.qopt').forEach(b => {
    b.disabled = true;
    if(b.textContent === q.ans) b.classList.add('right');
    else if(b === btn) b.classList.add('bad');
  });
  qHeadEl.innerHTML = qHeadHTML(); bindQClose();

  const fd = document.getElementById('qFeed');
  fd.innerHTML = `<span class="${ok ? 'good' : 'bad'}">${ok ? t('qCorrect') : t('qWrong')}</span>
    ${ok ? '' : `<span class="ansis">${t('qAnswerWas')}: <b>${q.ans}</b></span>`}
    <button class="btn" id="qNext">${QZ.i >= QZ.len ? t('qResult') : t('qNext')}</button>`;
  document.getElementById('qNext').addEventListener('click', nextQ);
}

function answerFind(n, cell){
  if(QZ.answered) return;
  QZ.answered = true;
  const q = QZ.q;
  const ok = n === q.e.n;
  markScore(ok, q);
  q.ans = `${elName(q.e)} (${q.e.s})`;

  const right = document.querySelector(`.cell[data-n="${q.e.n}"]`);
  if(right) right.classList.add('qright');
  if(!ok && cell) cell.classList.add('qbad');

  qBarEl.innerHTML = `
    <span class="qbq ${ok ? 'good' : 'bad'}">${ok ? t('qCorrect') : `${t('qWrong')} — ${t('qAnswerWas')}: ${q.ans}`}</span>
    <span class="qbmeta">${QZ.i}/${QZ.len} · ${t('qScore')} ${QZ.score}</span>
    <button class="btn" id="qBarNext">${QZ.i >= QZ.len ? t('qResult') : t('qNext')}</button>`;
  document.getElementById('qBarNext').addEventListener('click', () => {
    document.querySelectorAll('.qright,.qbad').forEach(c => c.classList.remove('qright','qbad'));
    nextQ();
  });
}

function qShowResult(){
  setFocus(true);
  qBarEl.classList.remove('on');
  document.querySelectorAll('.qright,.qbad').forEach(c => c.classList.remove('qright','qbad'));
  quizEl.classList.add('on');

  const pct = Math.round(QZ.score / QZ.len * 100);
  const prev = getBest();
  const isBest = QZ.score > prev;
  if(isBest) setBest(QZ.score);
  if(pct === 100) SFX.gem(); else if(pct >= 60) SFX.ok(); else SFX.fail();

  qHeadEl.innerHTML = `<h2>${t('qResult')}</h2><span class="x" id="qClose">×</span>`;
  bindQClose();

  qBodyEl.innerHTML = `
    <div class="qscore">${QZ.score}<span>/ ${QZ.len}</span></div>
    <div class="qpct">${pct}%${isBest ? ` <em>${t('qNewBest')}</em>` : ''}</div>
    <div class="qmeta">${t('qBest')} ${Math.max(prev, QZ.score)} · ${t('qStreak')} ${QZ.bestStreak}</div>
    ${QZ.wrong.length ? `
      <div class="qwtitle">${t('qReview')}</div>
      <div class="qwlist">${QZ.wrong.map(w => `
        <div class="qw">
          <span class="s" style="color:${cssv(CAT[w.e.c].v)}">${w.e.s}</span>
          <span class="n">${elName(w.e)}</span>
          <span class="a">${w.ans}</span>
        </div>`).join('')}</div>`
      : `<div class="qperfect">${t('qNoWrong')}</div>`}
    <div class="qbtns">
      <button class="btn" id="qAgain">${t('qRetry')}</button>
      <button class="btn ghost" id="qHome">${t('qQuit')}</button>
    </div>`;

  document.getElementById('qAgain').addEventListener('click', qStartRun);
  document.getElementById('qHome').addEventListener('click', qEnd);
}

function qEnd(){
  QZ.on = false; QZ.q = null;
  quizEl.classList.remove('on');
  qBarEl.classList.remove('on');
  document.querySelectorAll('.qright,.qbad').forEach(c => c.classList.remove('qright','qbad'));
  paint();
}

   외우기
   order  순서 외우기   fill  빈칸 채우기   card  플래시카드
   ═══════════════════════════════════════════════════ */
var MEM = {   // makeCell 이 초기화 전에 참조할 수 있어 var
  on:false, mode:'order', hi:20, dir:'sym2name',
  i:0, wrong:[], answered:false,
  tray:[], picked:null, misses:0, placed:0,
  queue:[], done:0, flipped:false, repeats:0,
};

function memPool(){ return EL.filter(e => e.n <= MEM.hi); }
function memBestKey(){ return `pt_mem_${MEM.mode}_${MEM.hi}`; }
function memBest(){ try{ return +(localStorage.getItem(memBestKey()) || 0); }catch(e){ return 0; } }
function memSetBest(v){ try{ localStorage.setItem(memBestKey(), v); }catch(e){} }

/* 원소별 성적 누적: { 기호: [맞힘, 틀림] }
   틀린 횟수만으로는 "3번 틀림"이 10번 중 3번인지 3번 중 3번인지 알 수 없다 */
function loadStat(){
  try{ return JSON.parse(localStorage.getItem('pt_stat') || '{}'); }
  catch(e){ return {}; }
}
function bumpStat(sym, ok){
  try{
    const st = loadStat();
    const cur = st[sym] || [0, 0];
    cur[ok ? 0 : 1]++;
    st[sym] = cur;
    localStorage.setItem('pt_stat', JSON.stringify(st));
  }catch(e){}
}
function noteMiss(sym){ bumpStat(sym, false); }
function noteHit(sym){ bumpStat(sym, true); }
