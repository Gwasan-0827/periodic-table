<style>
  :root{
    --wall:#101722; --floor:#131b25; --ink:#e8edf5; --dim:#8fa1b7;
    --door:#1b2533; --frame:#2a3647; --tape:#ffd43b; --tape-ink:#15171b; --warm:#ffd8a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overscroll-behavior:none}   /* 폰에서 아래로 쓸어도 당겨서 새로고침이 되지 않게 */
  body{
    margin:0;color:var(--ink);overflow-x:hidden;
    font-family:'Orbit','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100%;
    padding:max(16px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg, var(--wall) 0 68%, var(--floor) 68% 100%);
  }
  body.shake main{animation:shake .45s}
  @keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tbtn{
    display:inline-flex;align-items:center;gap:6px;color:#c9d3e0;font-size:14px;
    border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 13px;background:none;font-family:inherit;cursor:pointer;
  }
  .tbtn:hover{border-color:rgba(255,255,255,.32);color:#fff}
  a.tbtn{text-decoration:none}
  button:focus-visible{outline:2px solid #a5d8ff;outline-offset:3px}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px 0}

  /* ── 문 ── */
  .stage{position:relative;width:min(260px,62vw);aspect-ratio:5/9;perspective:900px}
  .frame{position:absolute;inset:0;border:10px solid var(--frame);border-bottom:none;border-radius:6px 6px 0 0;pointer-events:none;z-index:4}
  .inside{   /* 문 뒤 실험실 (문이 열리면 보인다) */
    position:absolute;inset:10px 10px 0;overflow:hidden;border-radius:2px;
    background:#e9eef2;
  }
  .inside svg{width:100%;height:100%;display:block;transform:scaleX(-1)}   /* 문이 열리면 보이는 오른쪽에 하얀 벽이 오게 */
  .door{
    position:absolute;inset:10px 10px 0;z-index:3;cursor:pointer;border:0;padding:0;
    background:linear-gradient(90deg,#18212d,var(--door) 30%,#1e2939 70%,#18212d);
    transform-origin:0 50%;transition:transform .9s cubic-bezier(.3,.7,.3,1);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  /* 열린 문짝은 보는 사람 쪽으로 나오므로 문틀보다 앞에 (닫히는 동안에도) */
  .door.ajar{transform:rotateY(-30deg);z-index:5}   /* 빼꼼: 틈만 조금 */
  .door.slam{transition:transform .12s ease-in;z-index:5}
  .stage::after{   /* 문 밑 틈으로 새는 빛 */
    content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;z-index:2;   /* 열린 문짝보다 뒤 */
    background:radial-gradient(50% 100% at 50% 0,rgba(220,236,255,.4),transparent 70%);
  }
  @media (prefers-reduced-motion:no-preference){ .stage::after{animation:leak 3.2s ease-in-out infinite} @keyframes leak{50%{opacity:.45}} }

  .window{
    position:absolute;left:18%;right:18%;top:12%;height:30%;border-radius:4px;overflow:hidden;
    border:3px solid #33415a;background:#e9eef2;cursor:pointer;padding:0;
  }
  .window svg{position:absolute;inset:0;width:100%;height:100%}
  /* 창문 속 풍경 = 문 뒤 실험실 그림을 그대로 가져와 창문 자리만큼 보여 준다 (창문: 문의 가로 18~82%, 세로 12~42%) */
  .win-view{position:absolute;left:-28.125%;top:-40%;width:156.25%;height:333.333%;pointer-events:none}
  .win-view svg{position:static;width:100%;height:100%;display:block;transform:scaleX(-1)}
  .fog{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(160deg,#5b7288,#3e5064 60%,#50667c);
    font-size:clamp(12px,3.4vw,15px);line-height:1.35;color:#eef4fb;
    transition:opacity .5s ease;
  }
  .fog b{display:block;font-size:1.25em}
  .window.clear .fog{opacity:0;transition:opacity .35s ease}
  .window .wipe{position:absolute;top:-20%;bottom:-20%;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);opacity:0}
  .window.clear .wipe{animation:wipe .6s ease-out}
  @keyframes wipe{0%{left:-50%;opacity:1}100%{left:120%;opacity:0}}

  .knob{
    position:absolute;right:10%;top:44%;width:22px;height:22px;z-index:7;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:radial-gradient(circle at 35% 35%,#dfe5ec,#8a94a3 70%);box-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .knob.rattle{animation:rattle .5s}
  @keyframes rattle{15%{transform:rotate(-35deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-30deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-12deg)}}
  .door.jiggle{animation:jiggle .5s}
  @keyframes jiggle{20%,60%{translate:2px 0}40%,80%{translate:-2px 0}}
  .sign{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font-size:11px;color:var(--dim);border:1px solid #33415a;border-radius:4px;padding:3px 8px;white-space:nowrap;pointer-events:none}
  /* 문이 열리면 틈 사이로 빼꼼 나오는 캐릭터 (문짝보다 뒤, 실험실보다 앞) */
  .peeker{
    position:absolute;left:86.5%;bottom:0;height:88%;z-index:2;pointer-events:none;   /* 전신: 발이 바닥에 */
    transform:translateX(-30%) rotate(0deg);opacity:0;transform-origin:0 60%;
    transition:transform .45s cubic-bezier(.3,1.4,.5,1), opacity .2s;
  }
  .peeker img{display:block;height:100%;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .peeker.out{transform:translateX(0);opacity:1;z-index:6}   /* 고개 갸웃은 그림(누구세여)에 이미 들어 있다 */   /* 콘티: 문 가장자리 앞으로 머리가 쑥, 5° */
  .peeker.back{transform:translateX(-30%) rotate(0deg);opacity:0;z-index:6;transition:transform .18s ease-in, opacity .16s}
  /* 코나미: 문짝 뜯기 */
  .door.wrench{animation:wrench .7s linear}
  @keyframes wrench{10%{translate:-4px 0;rotate:-1.5deg}20%{translate:5px -2px;rotate:2deg}30%{translate:-6px 1px;rotate:-2.5deg}40%{translate:6px -3px;rotate:3deg}50%{translate:-7px 0;rotate:-3deg}60%{translate:7px -2px;rotate:3.5deg}70%{translate:-8px 1px;rotate:-4deg}80%{translate:8px -3px;rotate:4deg}90%{translate:-5px 0;rotate:-2deg}}
  .door.ripped{transform-origin:50% 100%;transform:translateY(40px) rotateX(-84deg);opacity:0;z-index:7;
    transition:transform .55s cubic-bezier(.5,0,.9,.6), opacity .3s .5s}
  .door.install{transform:translateY(-130%);opacity:1;transition:none}
  .door.drop{transform:none;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  .tape.fly{transition:transform .8s cubic-bezier(.2,.7,.4,1), opacity .6s .3s;opacity:0}
  .tape.a.fly{transform:translate(-160px,-120px) rotate(-120deg)}
  .tape.b.fly{transform:translate(170px,-90px) rotate(140deg)}
  .dust{position:absolute;bottom:-4px;width:26px;height:26px;border-radius:50%;background:rgba(200,210,222,.35);z-index:8;pointer-events:none;animation:dust 1.1s ease-out forwards}
  @keyframes dust{from{transform:scale(.4);opacity:.9}to{transform:translate(var(--dx),-30px) scale(2.6);opacity:0}}
  .peeker.full{left:28%;top:30%;transform:none;opacity:1;transition:left .01s, transform .3s}
  /* 문 박살 뒤 화남: 빡침 마크가 뿅, 몸이 한 번 통 (나중에 캐릭터의 허리에 손 올린 그림으로 바꾼다) */
  .peeker img{position:relative;z-index:1}
  .peeker .mad{position:absolute;right:-22%;top:-22%;width:48%;height:auto;z-index:2;opacity:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));transform:scale(.2) rotate(-20deg);pointer-events:none}
  .peeker.angry .mad{opacity:1;transform:scale(1) rotate(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1), opacity .1s}
  .peeker.angry img{animation:huff .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes huff{30%{transform:translateY(-8%) scale(1.04,.96)}60%{transform:translateY(0) scale(.97,1.03)}}
  .peeker.angry .mad{animation:throb .6s ease-in-out .35s infinite}
  @keyframes throb{50%{scale:1.12}}
  .knob.armed{box-shadow:0 0 0 3px #ffd43b,0 0 16px #ffd43b;animation:armed .8s ease-in-out infinite}
  @keyframes armed{50%{box-shadow:0 0 0 5px #ffd43b,0 0 26px #ffd43b}}
  /* 문짝이 뜯긴 자리에 서 있는 아스리엘 (멀뚱 → 허리에 손 + 빠직) */
  .stander{position:absolute;left:50%;bottom:0;height:86%;z-index:2;pointer-events:none;opacity:0;
    transform:translate(-50%,6%) scale(.96);transform-origin:50% 100%;transition:opacity .2s, transform .35s cubic-bezier(.3,1.5,.5,1)}
  .stander img{display:block;height:100%;width:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
  .stander.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .stander.angry img{animation:huff .45s cubic-bezier(.3,1.6,.5,1)}
  .stander .mad{position:absolute;left:58%;top:4%;width:38%;height:auto;z-index:2;opacity:0;transform:scale(.2) rotate(-20deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .stander.angry .mad{opacity:1;transform:scale(1) rotate(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1), opacity .1s;animation:throb .6s ease-in-out .35s infinite}
  /* 빼꼼 반응: 머리 옆 하늘색 ? */
  .peeker .q{position:absolute;right:30%;top:-4%;z-index:3;font:900 30px/1 'Orbit',system-ui,sans-serif;color:#74c0fc;
    text-shadow:0 2px 0 #1b2533,0 0 8px rgba(116,192,252,.6);opacity:0;transform:scale(.3) rotate(-15deg)}
  .peeker.q-on .q{opacity:1;transform:scale(1) rotate(8deg);transition:transform .3s cubic-bezier(.3,1.8,.5,1), opacity .1s}
  /* 문 가장자리를 잡은 손 (문짝에 붙어 있어서 문과 같이 움직인다) */
  .door .hand{position:absolute;right:-4%;top:41%;width:8.5%;z-index:4;pointer-events:none;opacity:0;transform:translateX(30%);
    transition:opacity .15s, transform .3s cubic-bezier(.3,1.4,.5,1)}
  .door .hand img{display:block;width:100%;height:auto;filter:drop-shadow(-1px 2px 2px rgba(0,0,0,.35))}
  .door.grip .hand{opacity:1;transform:none}
  .rip{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid rgba(255,255,255,.35);pointer-events:none;animation:rip .5s ease-out forwards}
  @keyframes rip{to{transform:scale(4);opacity:0}}

  /* 공사 중 테이프 (끌어서 뗄 수 있다) */
  .tape{
    position:absolute;left:-18%;right:-18%;top:50%;height:30px;z-index:6;border:0;padding:0;cursor:grab;touch-action:none;
    background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,var(--tape-ink) 16px 32px);
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.45);
    transition:transform .7s cubic-bezier(.3,1.5,.4,1);
  }
  .tape span{background:var(--tape);color:var(--tape-ink);font-weight:800;font-size:12px;padding:2px 10px;white-space:nowrap;pointer-events:none}
  .tape.a{transform-origin:6% 50%;transform:translateY(-50%) rotate(-24deg)}
  .tape.b{transform-origin:94% 50%;transform:translateY(-50%) rotate(20deg);top:62%}
  .tape.a.peeled{transform:translateY(-50%) rotate(58deg)}
  .tape.b.peeled{transform:translateY(-50%) rotate(-66deg)}
  .tape.wig{animation:wig .35s}
  @keyframes wig{50%{filter:brightness(1.2);margin-top:-3px}}

  /* 말풍선: 안에서 들리는 목소리 / 문 아래 자막 */
  .say{
    position:absolute;left:50%;top:-14px;transform:translate(-50%,-100%) scale(.9);z-index:8;opacity:0;pointer-events:none;
    background:#f1f3f5;color:#15171b;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;white-space:nowrap;
    transition:opacity .2s, transform .2s;
  }
  .say::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#f1f3f5}
  .say.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .cap{min-height:1.5em;font-size:14px;color:#c9d3e0;text-align:center;transition:opacity .3s}
  .cap:empty{opacity:0}

  .copy{text-align:center;max-width:30em}
  .copy h1{margin:0 0 10px;font-size:clamp(22px,5vw,30px);font-weight:800}
  .copy p{margin:0;color:#c9d3e0;font-size:15px;line-height:1.7}
  .copy .soon{margin-top:14px;font-size:13px;color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:20;
    background:#141a22;border:1px solid #c9a227;border-radius:12px;padding:10px 16px;text-align:center;transition:.3s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast small{display:block;color:#ffd43b;font-size:11px;margin-bottom:2px}
  /* ═══ #preview: 완성된 문 → 카메라무빙 → 하얀 화면 → 실험실 입장 ═══ */
  body.preview .tape{display:none}
  body.preview .door{cursor:pointer}
  .door.wide{transform:rotateY(-78deg);z-index:5;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
  .flood{position:absolute;inset:10px 10px 0;z-index:1;pointer-events:none;opacity:0;
    background:radial-gradient(80% 60% at 60% 45%,#ffffff,rgba(255,255,255,.55) 45%,transparent 80%)}
  .flood.on{opacity:1;transition:opacity .6s ease}
  main{transform-origin:50% 50%}
  #white{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  #labIn{position:fixed;inset:0;z-index:29;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
    padding:24px;color:#1b2533;background:linear-gradient(180deg,#f4f7fa 0 70%,#dfe5eb 70% 100%)}
  #labIn.on{display:flex}
  #labIn h2{margin:0;font-size:clamp(22px,5vw,32px);font-weight:800}
  #labIn p{margin:0;max-width:30em;font-size:15px;line-height:1.7;color:#44536a}
  #labIn .row{display:flex;gap:10px;margin-top:6px}
  #labIn .libtn{display:inline-block;text-decoration:none}
  #labIn button,#labIn .libtn{border:1px solid #c3ccd6;background:#fff;color:#1b2533;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
  #labIn button:hover,#labIn .libtn:hover{border-color:#8a99ab}
  .pv-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:#4d8dff;border-radius:6px;padding:2px 8px}

  /* ═══ 카메라무빙 깊이감: 방 레이어(패럴랙스) · 빛 속 먼지(줌 블러) · 비네팅 ═══ */
  body{background:var(--wall)}
  #room{position:fixed;inset:-10%;z-index:-1;pointer-events:none;will-change:transform;   /* 뒤로 물러날 때 가장자리가 비지 않게 화면보다 크게 */
    background:linear-gradient(180deg, var(--wall) 0 65%, var(--floor) 65% 100%)}
  #room .lamp{position:absolute;left:50%;top:8.3%;width:min(560px,130vw);height:56%;transform:translateX(-50%);
    background:radial-gradient(50% 62% at 50% 0,rgba(190,215,255,.09),transparent 72%)}
  #room svg{position:absolute;left:0;top:65%;width:100%;height:35%;display:block}
  #vig{position:fixed;inset:0;z-index:27;pointer-events:none;opacity:0;
    background:radial-gradient(circle farthest-corner at var(--vx,50%) var(--vy,50%),transparent 28%,rgba(3,6,12,.9) 100%)}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:28;pointer-events:none}
  #fx.over{z-index:31}
  .top{transition:opacity .3s}
  body.moving .top{opacity:0;pointer-events:none}
  /* 도착: 글씨가 차례로 떠오른다 */
  #labIn.arrive > *{opacity:0;transform:translateY(14px)}
  #labIn.arrive.go > *{opacity:1;transform:none;transition:opacity .45s ease, transform .7s cubic-bezier(.2,1.5,.4,1)}
  #labIn.arrive.go > :nth-child(1){transition-delay:.28s}
  #labIn.arrive.go > :nth-child(2){transition-delay:.36s}
  #labIn.arrive.go > :nth-child(3){transition-delay:.46s}
  #labIn.arrive.go > :nth-child(4){transition-delay:.56s}
  @media (prefers-reduced-motion:reduce){ body.shake main,.knob.rattle,.door.jiggle{animation:none} .door{transition:none} }

  /* ── 코나미 (폰): 아스리엘 전용 매뉴얼 UI 'B.l.u.e. 커맨드' ── */
  .knob{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  .knob.charging{box-shadow:0 0 0 3px rgba(116,192,252,.95),0 0 18px #74c0fc;transition:box-shadow .6s ease-in}
  #bluecmd{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;
    padding:0 10px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(4,10,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #bluecmd.on{opacity:1;pointer-events:auto}
  /* 작업 표시줄 (Windows 11 느낌의 알약 모양 하늘색 바) */
  .bc-bar{display:flex;gap:2px;padding:6px 10px;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:999px;
    background:#b9dffd;border:2px solid #8cc0fb;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
    transform:translateY(80px);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
  .bc-bar::-webkit-scrollbar{display:none}
  #bluecmd.on .bc-bar{transform:none}
  .bc-app{position:relative;flex-shrink:0;width:38px;height:38px;padding:8px;border:0;border-radius:10px;background:transparent;color:#2a5a96;cursor:pointer}
  .bc-app svg{display:block;width:100%;height:100%}
  .bc-app:hover{background:rgba(255,255,255,.45)}
  .bc-app.on{background:rgba(255,255,255,.6)}
  .bc-app.on::after{content:'';position:absolute;left:50%;bottom:2px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#2f7de1}
  .bc-app.locked{animation:bcLock .35s}
  @keyframes bcLock{25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
  .bc-tip{position:fixed;z-index:61;transform:translate(-50%,-100%) scale(.8);opacity:0;pointer-events:none;white-space:nowrap;
    padding:6px 10px;border-radius:10px;background:#f4faff;border:1.5px solid #8cc0fb;color:#1f4f8a;font:700 12px/1.3 system-ui,sans-serif;
    box-shadow:0 6px 16px rgba(0,0,0,.3);transition:opacity .15s,transform .15s}
  .bc-tip.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  /* 키보드 창 (작업 표시줄 위로 뜨는 플라이아웃) */
  .bc-panel{width:min(360px,100%);padding:10px 14px 16px;border-radius:18px;background:#f0f8ff;border:2px solid #8cc0fb;
    box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(24px) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,1.3,.4,1) .05s,opacity .2s .05s}
  #bluecmd.on .bc-panel{transform:none;opacity:1}
  #bluecmd.nokbd .bc-panel{transform:translateY(24px) scale(.96);opacity:0;pointer-events:none}
  .bc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .bc-head b{font:800 12px/1 system-ui,sans-serif;letter-spacing:.06em;color:#2f7de1}
  .bc-head span{font:600 12px/1 system-ui,sans-serif;color:#5b7ea8}
  .bc-x{margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#5b7ea8;font-size:14px;cursor:pointer}
  .bc-x:hover{background:#dcecfc}
  .bc-screen{padding:7px 8px;margin-bottom:14px;border-radius:10px;background:#dcecfc;border:1.5px solid #b9dffd}
  .bc-slots{display:flex;gap:4px}
  .bc-slots i{flex:1;height:24px;border-radius:6px;background:#fff;border:1px dashed #a9cff5;color:#2f7de1;font:800 14px/22px ui-monospace,monospace;font-style:normal;text-align:center}
  .bc-slots i.on{border-style:solid;border-color:#74c0fc;background:#eaf5ff;box-shadow:0 0 6px rgba(116,192,252,.6)}
  .bc-screen.miss{animation:bcMiss .3s}
  @keyframes bcMiss{25%{transform:translateX(-6px);background:#ffe3e3}75%{transform:translateX(6px);background:#ffe3e3}}
  .bc-screen.win .bc-slots i{background:#74c0fc;border-color:#2f7de1;color:#fff;transition:background .1s}
  .bc-keys{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
  .bc-dpad{position:relative;width:138px;height:138px;flex-shrink:0}
  .bc-dpad button,.bc-ab button{position:absolute;width:46px;height:46px;border:0;border-radius:12px;cursor:pointer;
    background:#fff;color:#2a5a96;font:800 18px/1 system-ui,sans-serif;border:1.5px solid #b9dffd;box-shadow:0 3px 0 #a9cff5}
  .bc-u{left:46px;top:0}.bc-d{left:46px;bottom:0}.bc-l{left:0;top:46px}.bc-r{right:0;top:46px}
  .bc-ab{position:relative;width:128px;height:100px}
  .bc-ab button{width:54px;height:54px;border-radius:50%;background:#74c0fc;color:#fff;border-color:#4dabf7;box-shadow:0 3px 0 #3b8fd6}
  .bc-ab button[data-k="b"]{left:0;bottom:4px}.bc-ab button[data-k="a"]{right:0;top:4px}
  .bc-dpad button.hit,.bc-ab button.hit{animation:bcHit .12s}
  @keyframes bcHit{50%{transform:translateY(3px);box-shadow:0 0 0 transparent}}
</style>
</head>
<body>
  <!-- 벽·바닥 (카메라무빙 때 문보다 느리게 움직여 깊이감을 준다) -->
  <div id="room" aria-hidden="true">
    <div class="lamp"></div>
    <svg viewBox="0 0 100 32" preserveAspectRatio="none">
      <g stroke="rgba(255,255,255,.045)" stroke-width="1" vector-effect="non-scaling-stroke" fill="none">
        <path vector-effect="non-scaling-stroke" d="M0 .3 H100" stroke="rgba(255,255,255,.08)"/>
        <path vector-effect="non-scaling-stroke" d="M-150 32 L50 -40 M-75 32 L50 -40 M-10 32 L50 -40 M30 32 L50 -40 M70 32 L50 -40 M110 32 L50 -40 M175 32 L50 -40 M250 32 L50 -40"/>
        <path vector-effect="non-scaling-stroke" d="M0 2.2 H100 M0 5 H100 M0 9 H100 M0 14.5 H100 M0 22 H100"/>
      </g>
    </svg>
  </div>
  <div class="top">
    <a class="tbtn" id="back" href="index.html">‹ 주기율표로 돌아가기</a>
    <button type="button" class="tbtn" id="snd" aria-pressed="true">🔊</button>
  </div>
  <main>
    <div class="stage" id="stage">
      <!-- 문 뒤: 짓다 만 실험실 -->
      <div class="inside" aria-hidden="true">
        <svg viewBox="0 0 100 180" preserveAspectRatio="xMidYMid slice">
          <!-- 벽 붙이는 중: 왼쪽은 하얀 타일 벽, 오른쪽은 아직 합판과 각목 -->
          <rect x="0" y="0" width="100" height="180" fill="#3a2d20"/>
          <g stroke="#6b5840" stroke-width="3"><path d="M66 0 v150 M82 0 v150 M98 0 v150"/></g>
          <path d="M60 0 v150" stroke="#6b5840" stroke-width="1.5"/>
          <rect x="0" y="0" width="60" height="150" fill="#e9eef2"/>
          <g stroke="#d3dbe2" stroke-width=".8"><path d="M0 15 h60 M0 30 h60 M0 45 h60 M0 60 h60 M0 75 h60 M0 90 h60 M0 105 h60 M0 120 h60 M0 135 h60 M15 0 v150 M30 0 v150 M45 0 v150"/></g>
          <rect x="0" y="150" width="60" height="30" fill="#cfd6dc"/><rect x="60" y="150" width="40" height="30" fill="#6c6f73"/>
          <rect x="10" y="4" width="36" height="4" rx="2" fill="#ffffff"/><ellipse cx="28" cy="14" rx="30" ry="12" fill="#f1f8ff" opacity=".35"/>
          <g stroke="#b8c2cc" stroke-width="2"><path d="M6 50 h48 M6 78 h48"/></g>
          <g>
            <rect x="10" y="38" width="6" height="12" rx="1.5" fill="#74c0fc"/><rect x="19" y="41" width="5" height="9" rx="1.5" fill="#ff8787"/>
            <rect x="27" y="36" width="7" height="14" rx="1.5" fill="#8ce99a"/><rect x="38" y="42" width="5" height="8" rx="1.5" fill="#ffd43b"/>
            <rect x="13" y="67" width="7" height="11" rx="1.5" fill="#b197fc"/><rect x="24" y="70" width="5" height="8" rx="1.5" fill="#63e6be"/>
          </g>
          <rect x="4" y="118" width="54" height="6" fill="#f8f9fa"/><path d="M8 124 v26 M54 124 v14" stroke="#adb5bd" stroke-width="3"/>
          <path d="M34 110 q4 -10 8 0 z" fill="#cfe9ff"/><rect x="35" y="106" width="6" height="4" fill="#cfe9ff"/>
          <g fill="#f1f3f5" stroke="#ced4da" stroke-width=".8"><path d="M64 150 l6 -70 h14 l-6 70 z"/><path d="M72 150 l8 -66 h13 l-7 66 z"/></g>
          <g stroke="#9c8a6e" stroke-width="2.4"><path d="M84 60 l6 100 M96 60 l-2 100"/><path d="M85 80 h10 M86 102 h9 M87 124 h8 M88 146 h7"/></g>
          <rect x="66" y="160" width="12" height="11" rx="2" fill="#f59f00"/>
        </svg>
      </div>
      <!-- 빼꼼 아스리엘: lab_asriel_peek.webp (그림을 바꿀 땐 같은 이름으로 덮어쓰면 된다) -->
      <div class="peeker" id="peeker" aria-hidden="true" data-head-x="0.42" data-head-y="0.03">
        <img class="mad" alt="" src="lab_mad.webp">
        <img alt="" src="lab_asriel_knock.webp">
        <span class="q" aria-hidden="true">?</span></div>
      <!-- 문짝이 뜯겼을 때 서 있는 아스리엘: lab_asriel_stand.webp → lab_asriel_angry.webp -->
      <div class="stander" id="stander" aria-hidden="true" data-head-x="0.5" data-head-y="0.02">
        <img id="standImg" alt="" src="lab_asriel_stand.webp">
        <img class="mad" alt="" src="lab_mad.webp">
      </div>
      <div class="door" id="door" role="button" tabindex="0" aria-label="문 두드리기">
        <button type="button" class="window" id="win" aria-label="창문 들여다보기">
          <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="100" height="60" fill="#3a2d20"/>
            <g stroke="#6b5840" stroke-width="3"><path d="M70 0 v60 M86 0 v60"/></g>
            <rect width="62" height="60" fill="#e9eef2"/>

<script>
/* 언어: 직접 고른 적이 있으면 그 언어, 처음이면 브라우저(폰) 언어가 한국어일 때만 한국어, 아니면 영어 */
function ptLang(){
  try{ const s = localStorage.getItem('pt_lang'); if(s === 'ko' || s === 'en') return s; }catch(e){}
  const l = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
  return l.startsWith('ko') ? 'ko' : 'en';
}
(() => {
  /* 창문 속 풍경을 문 뒤 실험실 그림에서 복사 (둘이 늘 같은 방이 되게) */
  (() => {
    const src = document.querySelector('.inside svg'), win = document.getElementById('win');
    const old = win && win.querySelector(':scope > svg');
    if(!src || !old) return;
    const v = document.createElement('div'); v.className = 'win-view'; v.setAttribute('aria-hidden', 'true');
    v.appendChild(src.cloneNode(true)); old.replaceWith(v);
  })();
  const EN = ptLang() === 'en';
  document.documentElement.lang = EN ? 'en' : 'ko';
  const T = EN ? {
    back:'‹ Back to the table', win1:'Chemistry lab', win2:'Staff only', sign:'Lab · under construction',
    tapeA:'UNDER CONSTRUCTION', tapeB:'DO NOT ENTER', h1:'The lab is still being built',
    p1:'We are moving in shelves and washing beakers.<br>When the door opens you will be able to experiment with what you found on the table.',
    soon:'Meanwhile, find more combinations on the table — they will be your lab supplies. (Feel free to poke at the door.)',
    locked:'Locked.', retape:'…better stick that back on.', peekSay:'No peeking!',
    replies:['Under construction!', 'Not yet~', 'Washing beakers!', 'Who is it?', 'Just a bit longer!'],
    achTop:'Hidden achievement', achName:'No peeking', enterPrev:'Entering the lab!<br><small>(preview — the lab is not open yet)</small>', winReady:'Chemistry lab', ripName:'Door ripper', ripHuh:'Mweh?', ripSay:'It says UNDER CONSTRUCTION!', newDoor:'Fitting a new door…', knock:'Knock on the door', win:'Look through the window', knob:'Turn the handle', tape:'Peel the tape',
    title:'Lab (under construction) — Periodic table', doorLabel:'A chemistry lab door taped off for construction'
  } : {
    back:'‹ 주기율표로 돌아가기', win1:'화학 실험실', win2:'관계자 외 출입 금지', sign:'실험실 · 공사 중',
    tapeA:'공사 중', tapeB:'출입 금지', h1:'실험실은 아직 짓는 중이에요',
    p1:'선반을 들이고 비커를 닦는 중이에요.<br>문이 열리면 주기율표에서 찾은 물질로 직접 실험할 수 있어요.',
    soon:'그동안 주기율표에서 조합을 더 찾아 두세요. 실험실 재료가 돼요. (문은 만져봐도 돼요)',
    locked:'잠겨 있어요', retape:'…다시 붙여야겠다', peekSay:'엿보기 금지!',
    replies:['공사 중이에요!', '아직이에요~', '비커 닦는 중!', '누구세요?', '조금만 기다려요!'],
    achTop:'숨은 업적', achName:'엿보기 금지', enterPrev:'실험실 입장!<br><small>(미리보기 — 아직 열리지 않았어요)</small>', winReady:'화학 실험실', ripName:'문짝 뜯기', ripHuh:'므에?', ripSay:'공사 중이라니까요!', newDoor:'새 문 다는 중…', knock:'문 두드리기', win:'창문 들여다보기', knob:'손잡이 돌리기', tape:'테이프 떼기',
    title:'실험실 (공사 중) — 주기율표', doorLabel:'공사 중 테이프가 붙은 화학 실험실 문'
  };
  const $ = s => document.querySelector(s);
  if(EN){
    document.documentElement.lang = 'en'; document.title = T.title;
    $('.fog b').textContent = T.win1; $('.fog-sub').textContent = T.win2; $('.sign').textContent = T.sign;
    $('.tape.a span').textContent = T.tapeA; $('.tape.b span').textContent = T.tapeB;
    $('.copy h1').textContent = T.h1; $('.copy p').innerHTML = T.p1;
  }
  $('#back').textContent = T.back;
  $('.soon').textContent = T.soon;
  $('#door').setAttribute('aria-label', T.knock); $('#win').setAttribute('aria-label', T.win);
  $('#knob').setAttribute('aria-label', T.knob); document.querySelectorAll('.tape').forEach(t => t.setAttribute('aria-label', T.tape));

  // 돌아가기: 주기율표에서 왔으면 뒤로, 바로 열었으면 같은 폴더의 index.html
  $('#back').addEventListener('click', e => {
    if(document.referrer && history.length > 1){ e.preventDefault(); history.back(); }
  });

  /* ── 소리 (코드로 만든다) ── */
  let on = true; try{ on = localStorage.getItem('pt_labsnd') !== '0'; }catch(e){}
  const sndBtn = $('#snd');
  const syncSnd = () => { sndBtn.textContent = on ? '🔊' : '🔇'; sndBtn.setAttribute('aria-pressed', on); };
  syncSnd();
  sndBtn.addEventListener('click', () => { on = !on; syncSnd(); try{ localStorage.setItem('pt_labsnd', on ? '1' : '0'); }catch(e){} });
  let AC = null;
  const ac = () => { if(!on) return null; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){ return null; } return AC; };
  const tone = (f, d, type, v, at = 0, f2) => {
    const a = ac(); if(!a) return; const t = a.currentTime + at;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
  };
  const noise = (d, v, type, freq, at = 0, q = 1) => {
    const a = ac(); if(!a) return; const t = a.currentTime + at;
    const len = Math.floor(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), c = b.getChannelData(0);
    for(let i = 0; i < len; i++) c[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
  };
  const S = {
    knock(){ noise(0.09, 0.5, 'lowpass', 420); tone(110, 0.1, 'sine', 0.35, 0, 70); },
    rattle(){ for(let i = 0; i < 6; i++) tone(900 + Math.random() * 500, 0.03, 'square', 0.04, i * 0.07); noise(0.12, 0.25, 'lowpass', 300, 0.42); },
    rip(){ noise(0.38, 0.25, 'highpass', 1800); tone(700, 0.3, 'sawtooth', 0.02, 0, 300); },
    stick(){ noise(0.06, 0.2, 'bandpass', 1200, 0, 3); tone(1400, 0.05, 'sine', 0.05, 0.05); },
    creak(){ tone(210, 0.8, 'sawtooth', 0.035, 0, 120); noise(0.8, 0.05, 'bandpass', 600, 0, 6); },
    slam(){ noise(0.45, 0.8, 'lowpass', 260); tone(70, 0.45, 'sine', 0.6, 0, 40); },
    wipe(){ noise(0.35, 0.12, 'bandpass', 3000, 0, 2); },
    ding(){ [880, 1175, 1568].forEach((f, i) => tone(f, 0.5, 'triangle', 0.06, i * 0.08)); },
    pop(){ tone(520, 0.12, 'sine', 0.08, 0, 900); },
    whoosh(){ noise(0.55, 0.18, 'bandpass', 900, 0, 0.8); tone(180, 0.5, 'sine', 0.05, 0, 900); },
  };

  const tapes = [...document.querySelectorAll('.tape')];
  let reT;

  /* ── 말풍선·자막 ── */
  const say = $('#say'), cap = $('#cap');
  let sayT, capT;
  // 말풍선: 기본은 문 위 가운데(안에서 들리는 목소리). who 를 주면 그 캐릭터 머리 위에서 나온다
  const speak = (txt, ms = 1600, who) => {
    say.textContent = txt;
    if(who){
      const st = $('#stage').getBoundingClientRect(), r = who.getBoundingClientRect();
      const hx = who.dataset.headX ? +who.dataset.headX : 0.5, hy = who.dataset.headY ? +who.dataset.headY : 0.04;
      say.style.left = (r.left - st.left + r.width * hx) + 'px';
      say.style.top = (r.top - st.top + r.height * hy) + 'px';
    } else { say.style.left = ''; say.style.top = ''; }
    say.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => say.classList.remove('on'), ms);
  };
  const caption = (txt, ms = 1800) => { cap.textContent = txt; clearTimeout(capT); capT = setTimeout(() => { cap.textContent = ''; }, ms); };
  const shake = () => { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); };
  let busy = false;

  /* ── 손잡이: 덜컥덜컥, 잠겨 있다 ── */
  const knob = $('#knob'), door = $('#door');
  knob.addEventListener('click', e => {
    e.stopPropagation(); if(busy || knob.classList.contains('armed')) return;
    knob.classList.remove('rattle'); door.classList.remove('jiggle'); void knob.offsetWidth;
    knob.classList.add('rattle'); door.classList.add('jiggle');
    S.rattle(); caption(T.locked);
  });

  /* ── 창문: 김 서린 유리를 닦아 잠깐 들여다본다 ── */
  const win = $('#win');
  let winT;
  win.addEventListener('click', e => {
    e.stopPropagation(); if(busy) return;
    win.classList.remove('clear'); void win.offsetWidth; win.classList.add('clear');
    S.wipe(); clearTimeout(winT);
    winT = setTimeout(() => win.classList.remove('clear'), 2400);
  });

  /* ── 노크: 가끔 대답이 온다. 빠르게 일곱 번이면 문이 열렸다가 쾅 ── */
  let knocks = 0, lastKnock = 0;
  const knock = (x, y) => {
    if(busy) return;
    S.knock();
    const r = door.getBoundingClientRect(), dot = document.createElement('span');
    dot.className = 'rip'; dot.style.left = (x - r.left) + 'px'; dot.style.top = (y - r.top) + 'px';
    door.appendChild(dot); setTimeout(() => dot.remove(), 520);
    const now = performance.now();
    knocks = now - lastKnock < 1200 ? knocks + 1 : 1; lastKnock = now;
    if(knocks >= 7){ knocks = 0; peek(); return; }
    if(knocks === 2 || (knocks > 2 && Math.random() < 0.3)){
      const rep = T.replies; setTimeout(() => speak(rep[Math.floor(Math.random() * rep.length)]), 260);
    }
  };
  door.addEventListener('click', e => knock(e.clientX, e.clientY));
  door.addEventListener('keydown', e => {
    if(e.target !== door || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); const r = door.getBoundingClientRect(); knock(r.left + r.width / 2, r.top + r.height * 0.7);
  });
  function peek(){
    busy = true;
    say.classList.remove('on');
    setTimeout(() => {
      door.classList.add('ajar'); S.creak();
      // 문이 밀고 나오면서 테이프가 뜯어진다
      clearTimeout(reT);
      setTimeout(() => { tapes.forEach(t => t.classList.add('peeled')); S.rip(); }, 220);
    }, 250);
    const pk = $('#peeker');
    setTimeout(() => { pk.classList.remove('back'); pk.classList.add('out'); S.pop(); }, 700);   // 손·? 는 그림(누구세여)에 들어 있다
    setTimeout(() => { try{ tone(700, 0.12, 'sine', 0.06, 0, 1100); }catch(e){} }, 900);
    setTimeout(() => speak(T.peekSay, 1000, pk), 1250);
    setTimeout(() => { pk.classList.add('back'); pk.classList.remove('out', 'q-on'); door.classList.remove('grip'); }, 1900);
    setTimeout(() => pk.classList.remove('back'), 2400);
    setTimeout(() => {
      door.classList.add('slam'); door.classList.remove('ajar'); S.slam(); shake();
      setTimeout(() => { door.classList.remove('slam'); busy = false; }, 250);
      // 쾅 닫힌 뒤, 뜯어진 테이프를 다시 붙인다
      reT = setTimeout(() => {
        caption(T.retape, 2000);
        setTimeout(() => { tapes.forEach(t => t.classList.remove('peeled')); S.stick(); }, 700);
      }, 1300);
      // 숨은 업적: 주기율표 앱의 업적 목록에도 뜬다 (같은 저장 공간)
      try{
        const ev = JSON.parse(localStorage.getItem('pt_evt') || '[]');
        if(!ev.includes('labPeek')){
          ev.push('labPeek'); localStorage.setItem('pt_evt', JSON.stringify(ev));
          const t = $('#toast'); t.innerHTML = `<small>${T.achTop}</small><b>${T.achName}</b>`;
          setTimeout(() => { t.classList.add('on'); S.ding(); }, 500);
          setTimeout(() => t.classList.remove('on'), 3600);
        }
      }catch(e){}
    }, 2100);
  }

  /* ── 코나미 커맨드: 문짝을 통째로 뜯어낸다 ──
     키보드 ↑↑↓↓←→←→ B A / 폰은 손잡이를 길게 눌러 나오는 B.l.u.e. 커맨드의 키보드로 입력한다 */
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let kbuf = [];
  document.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    kbuf.push(k); kbuf = kbuf.slice(-KONAMI.length);
    if(kbuf.join() === KONAMI.join()){ kbuf = []; ripDoor(); }
  });
  /* 폰: 손잡이를 길게 누르면 아스리엘 전용 매뉴얼 UI 'B.l.u.e. 커맨드'가 올라온다.
     키보드 창에서 ↑↑↓↓←→←→ B A 를 누르면 문짝 뜯기. 나머지 앱은 리엘이 전용이라 잠겨 있다
     (스와이프는 브라우저가 스크롤·뒤로 가기로 가로채서 폰에서 잘 안 먹혔다) */
  const PAD_SEQ = ['u','u','d','d','l','r','l','r','b','a'];
  const PAD_SYM = { u:'↑', d:'↓', l:'←', r:'→', b:'B', a:'A' };
  const ico = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const BC_APPS = [
    ['kbd',    EN ? 'Keyboard' : '키보드',      ico('<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M18 13.5h.01M8.5 14.5h7"/>')],
    ['table',  EN ? 'Periodic table' : '주기율표', ico('<rect x="3" y="4" width="4" height="4" rx=".8"/><rect x="17" y="4" width="4" height="4" rx=".8"/><rect x="3" y="10" width="4" height="4" rx=".8"/><rect x="10" y="10" width="4" height="4" rx=".8"/><rect x="17" y="10" width="4" height="4" rx=".8"/><rect x="6.5" y="16" width="11" height="4" rx=".8"/>')],
    ['mix',    EN ? 'Combine' : '조합',        ico('<path d="M9 3h6M10 3v6l-5.5 9.2A1.5 1.5 0 0 0 5.8 20.5h12.4a1.5 1.5 0 0 0 1.3-2.3L14 9V3"/><path d="M7.5 15h9"/>')],
    ['cursor', EN ? 'Cursor' : '커서',         ico('<ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(-60 12 12)"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>')],
    ['search', EN ? 'Search' : '검색',         ico('<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/>')],
    ['index',  EN ? 'Index' : '인덱스',        ico('<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7h6M9 10.5h4"/>')],

  /* 카메라: 뒤로 0.75초(느린 감속) → 앞으로 0.39초(강한 가속). 한 타임라인으로 문·벽·먼지·비네팅을 같이 움직인다 */
  const T_BACK = 750, T_RUSH = 390, S_BACK = .82, S_END = 10;

  function makeMotes(){   // 문틈으로 쏟아지는 빛 속 먼지: 문과 카메라 사이 여러 깊이에 흩어 둔다
    motes = [];
    for(let i = 0; i < 46; i++){
      const a = Math.random() * Math.PI * 2, r = .05 + Math.pow(Math.random(), .7) * .55;
      motes.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * .9, d: .1 + Math.random() * .75, sz: .5 + Math.random() * 1.1, px: null, py: null, tw: Math.random() * 6 });

  }
  function resetPreview(){
    const li = $('#labIn');
    li.classList.remove('on', 'arrive', 'go'); li.getAnimations().forEach(a => a.cancel());
    const main = document.querySelector('main');
    main.getAnimations().forEach(a => a.cancel()); $('#white').getAnimations().forEach(a => a.cancel());
    cancelAnimationFrame(raf); fxc.clearRect(0, 0, fx.width, fx.height); fx.classList.remove('over');
    main.style.transform = main.style.filter = room.style.transform = ''; vig.style.opacity = 0;
    document.body.classList.remove('moving');
    door.classList.remove('wide'); $('#flood').classList.remove('on');
    busy = false;
  }
  $('#liAgain').addEventListener('click', resetPreview);
  $('#liBack').addEventListener('click', e => { if(document.referrer && history.length > 1){ e.preventDefault(); history.back(); } });
  if(PREVIEW){
    // 미리보기에서는 문을 누르면 (손잡이·창문 포함) 바로 입장
    ['click', 'keydown'].forEach(ev => door.addEventListener(ev, e => {
      if(ev === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault(); e.stopImmediatePropagation(); enterLab();
    }, true));
  }

  /* ── 테이프: 끌어서 떼면 늘어진다. 둘 다 떼면 다시 붙인다 ── */
  tapes.forEach(tp => {
    let sx = 0, sy = 0, down = false, moved = false;
    tp.addEventListener('pointerdown', e => { if(busy) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; tp.setPointerCapture(e.pointerId); });
    tp.addEventListener('pointermove', e => {
      if(!down || moved || tp.classList.contains('peeled')) return;
      if(Math.hypot(e.clientX - sx, e.clientY - sy) > 36){ moved = true; peel(tp); }
    });
    tp.addEventListener('pointerup', () => { down = false; });
    tp.addEventListener('click', e => {
      e.stopPropagation();
      if(moved){ moved = false; return; }
      // 끌지 않고 누르기만 하면 살짝 들썩 (키보드로는 바로 뗀다)
      if(e.detail === 0) peel(tp);
      else { tp.classList.remove('wig'); void tp.offsetWidth; tp.classList.add('wig'); }
    });
  });
  function peel(tp){
    if(busy || tp.classList.contains('peeled')) return;
    tp.classList.add('peeled'); S.rip();
    if(tapes.every(t => t.classList.contains('peeled'))){
      clearTimeout(reT);
      reT = setTimeout(() => {
        caption(T.retape, 2000);
        setTimeout(() => { tapes.forEach(t => t.classList.remove('peeled')); S.stick(); }, 700);
      }, 900);
    }
  }
})();
</script>
<script>
/* ═══ 점검 중 화면: 저장소의 status.json 에서 "maintenance": true 면 덮는다 ═══
   주소 끝에 ?dev 를 붙이면 통과. 파일로 열 때(status.json 을 못 읽을 때)는 아무 일도 없다 */
(() => {
  if(/[?&]dev\b/.test(location.search)) return;
  const T = {
    ko: { h:'점검 중이에요', p:'지금 사이트를 손보는 중이에요. 조금만 기다렸다가 다시 와 주세요!', until:'예상 완료', again:'다시 확인',
          still:'아직 점검 중이에요', alt:'점검 중, 기다려주세요! 태블릿과 클립보드를 든 아스리엘과 헬멧을 쓴 로봇 조수들이 실험실을 고치는 중.' },
    en: { h:'Under maintenance', p:'We are fixing a few things right now. Please check back in a little while!', until:'Expected back', again:'Check again',
          still:'Still under maintenance', alt:'Under maintenance, please wait! Asriel with a tablet and clipboard and little robot helpers in hard hats fixing the lab.' },
  };
  const lang = () => ptLang();
  const check = () => fetch('status.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  function show(st){
    if(document.getElementById('rxMaint')) return;
    const t = T[lang()];
    const el = document.createElement('div');
    el.id = 'rxMaint';
    el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', t.h);
    el.innerHTML = `
      <style>
        #rxMaint{position:fixed;inset:0;z-index:2147483000;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
          padding:max(16px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));color:#1b2533;
          background:linear-gradient(180deg,#f7f9fc,#e9eef5);font-family:'Orbit','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
        #rxMaint img{display:block;width:min(1100px,100%);height:auto;border-radius:18px;box-shadow:0 18px 50px -24px rgba(27,37,51,.45)}
        #rxMaint h2{margin:4px 0 0;font-size:clamp(18px,3.4vw,24px);color:#2f6fd6}
        #rxMaint p{margin:0;max-width:40em;text-align:center;color:#5b6a80;font-size:clamp(13px,2.4vw,15px);line-height:1.7}
        #rxMaint .mt-until{font-weight:700;color:#1b2533}
        #rxMaint button{margin-top:4px;font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:12px;border:2px solid #1b2533;background:#1b2533;color:#fff;cursor:pointer}
        #rxMaint button:focus-visible{outline:3px solid #4d8dff;outline-offset:3px}
      </style>
      <img src="maint_asriel.webp" width="1600" height="900" alt="${t.alt}">
      <h2>${t.h}</h2>
      <p>${st.message ? String(st.message).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) : t.p}</p>
      ${st.until ? `<p class="mt-until">${t.until}: ${String(st.until).replace(/[<>&]/g, '')}</p>` : ''}
      <button type="button">${t.again}</button>`;
    document.body.appendChild(el);
    document.documentElement.style.overflow = 'hidden';
    const btn = el.querySelector('button');
    btn.addEventListener('click', () => {
      btn.disabled = true;
      check().then(s => {
        btn.disabled = false;
        if(s && s.maintenance){ btn.textContent = t.still; setTimeout(() => { btn.textContent = t.again; }, 1600); }
        else { el.remove(); document.documentElement.style.overflow = ''; }
      });
    });
    btn.focus({ preventScroll: true });
  }
  check().then(st => { if(st && st.maintenance) show(st); });
})();
</script>
</body>
