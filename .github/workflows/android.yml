# 페리오딕//테이블 안드로이드 빌드
# GitHub에 올리면 자동으로 돌고, Actions 탭에서 "Run workflow"로 직접 돌릴 수도 있다.
# 결과물(Artifacts):
#   - app-debug.apk      : 아빠 폰에 바로 설치해서 시험하는 용 (서명 필요 없음)
#   - app-release.aab    : 플레이스토어 업로드용 (Secrets에 서명 키를 넣었을 때만 만들어짐)
name: Android build
on:
  workflow_dispatch:
  push:
    branches: [ android-app ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 비밀값은 if: 에서 바로 못 쓰므로 여기서 있는지만 확인해 둔다
      HAS_KEY: ${{ secrets.PT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 웹 파일을 안드로이드 프로젝트로 복사
        run: |
          npm ci
          npx cap sync android
      - name: 테스트용 APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK를 apk-builds 브랜치에도 올리기 (바로 받기 쉽게)
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/periodic-table-debug.apk
          cd /tmp/out && git init -q -b apk-builds && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "debug APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
      - name: 출시용 AAB 만들기 (서명 키가 있을 때만)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          PT_KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
          PT_KEY_ALIAS: ${{ secrets.PT_KEY_ALIAS }}
          PT_KEY_PASSWORD: ${{ secrets.PT_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.PT_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          export PT_KEYSTORE=$RUNNER_TEMP/upload.jks
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
